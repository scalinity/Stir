# Stir — XcodeGen project specification
#
# Generate the Xcode project with:   xcodegen generate
# Open in Xcode with:                open Stir.xcodeproj
#
# Source of truth for project structure. If you change targets, settings, or
# dependencies, edit this file and re-run xcodegen. `Stir.xcodeproj` is committed
# alongside this file so new-clone-to-build path is just `xcodegen generate &&
# xcodebuild`.

name: Stir

options:
  bundleIdPrefix: com.scalinity
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.4"
  groupSortPosition: top
  generateEmptyDirectories: true
  # Settings presets: keep disabled to avoid XcodeGen injecting SwiftUI
  # defaults we don't want.
  settingPresets: none
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    DEVELOPMENT_TEAM: 25H5DDPKAC
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_ANALYZER_NONNULL: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    # Reduce binary size in Release.
    DEAD_CODE_STRIPPING: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    # Apple-Silicon-only: exclude x86_64 on simulator builds so Intel-only
    # slices don't fail package resolution on Macs where the SwiftPM
    # vendor dropped Rosetta support.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

packages:
  supabase-swift:
    url: https://github.com/supabase/supabase-swift
    from: 2.24.0
  posthog-ios:
    url: https://github.com/PostHog/posthog-ios
    from: 3.20.0
  sentry-cocoa:
    url: https://github.com/getsentry/sentry-cocoa
    from: 8.41.0
  purchases-ios-spm:
    url: https://github.com/RevenueCat/purchases-ios-spm
    from: 5.0.0

targets:
  Stir:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig

    sources:
      - path: Stir
        excludes:
          - "**/README.md"
      - path: Shared

    info:
      path: Stir/App/Info.plist
      properties:
        CFBundleDisplayName: Stir
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        UIApplicationSupportsIndirectInputEvents: true
        # Config.xcconfig values flow through as $(VAR) at build time.
        # Read at runtime via Bundle.main.infoDictionary.
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        PostHogPublicAPIKey: $(POSTHOG_PUBLIC_API_KEY)
        SentryDSNPublic: $(SENTRY_DSN_PUBLIC)
        RevenueCatPublicAPIKey: $(REVENUECAT_PUBLIC_API_KEY)
        # Live Activity hosting (main app starts activities via
        # LiveActivityManager; StirWidgets renders them).
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # Permission usage strings. Presented inside the system prompt.
        NSCameraUsageDescription: "Stir uses the camera to scan your kitchen and turn ingredients into tonight's dinner options."
        NSMicrophoneUsageDescription: "Stir listens hands-free during Cook Mode so you can ask questions without touching your phone."
        NSPhotoLibraryUsageDescription: "Stir reads recipe screenshots you pick so it can turn them into steps you can cook from."
        NSRemindersUsageDescription: "Stir writes your missing-ingredients list to Reminders so it shows up next time you're at the store."
        NSUserActivityTypes:
          - StartNewDinnerSolveIntent
          - ShowTonightsIdeaIntent
          - AddToGroceryIntent
        # Deep-link URL scheme used by widgets + share extension.
        CFBundleURLTypes:
          - CFBundleURLName: com.scalinity.stir
            CFBundleURLSchemes:
              - stir

    entitlements:
      path: Stir/App/Stir.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.scalinity.stir
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.scalinity.stir
        com.apple.security.application-groups:
          - group.com.scalinity.stir

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scalinity.stir
        PRODUCT_NAME: Stir
        DEVELOPMENT_TEAM: 25H5DDPKAC
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: -Onone
        Release:
          ENABLE_TESTABILITY: NO
          SWIFT_OPTIMIZATION_LEVEL: -O

    dependencies:
      - package: supabase-swift
        product: Supabase
      - package: posthog-ios
        product: PostHog
      - package: sentry-cocoa
        product: Sentry
      - package: purchases-ios-spm
        product: RevenueCat
      - target: StirWidgets
        embed: true
        copy:
          destination: plugins

  StirWidgets:
    # App extension hosting Home Screen widgets (TonightWidget) and
    # Live Activities (TimerLiveActivity). Compiled with the `Shared`
    # source path so it sees SharedStorage + TonightSnapshot +
    # TimerActivityAttributes without a separate framework target.
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"

    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig

    sources:
      - path: Extensions/StirWidgets
      - path: Shared

    info:
      path: Extensions/StirWidgets/Info.plist
      properties:
        CFBundleDisplayName: Stir Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true

    entitlements:
      path: Extensions/StirWidgets/StirWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.scalinity.stir

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scalinity.stir.widgets
        PRODUCT_NAME: StirWidgets
        DEVELOPMENT_TEAM: 25H5DDPKAC
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Extensions/StirWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/StirWidgets/StirWidgets.entitlements
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        # Must match parent Stir app. Xcode warns otherwise.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: -Onone
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O

    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework

  StirTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: StirTests
      - path: Shared

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scalinity.stir.tests
        PRODUCT_NAME: StirTests
        DEVELOPMENT_TEAM: 25H5DDPKAC
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Stir.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Stir
        GENERATE_INFOPLIST_FILE: YES

    dependencies:
      - target: Stir

schemes:
  Stir:
    build:
      targets:
        Stir: all
        StirWidgets: all
        StirTests: [test]
    run:
      config: Debug
      askForAppToLaunch: false
      language: en
      region: US
    test:
      config: Debug
      targets:
        - StirTests
      gatherCoverageData: true
      coverageTargets:
        - Stir
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
