<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stir — 03 Tonight Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    --font-sans: -apple-system, "SF Pro Text", "SF Pro Display", BlinkMacSystemFont,
                 "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-serif: "New York", "NewYork", ui-serif, "Source Serif 4",
                  "Charter", "Iowan Old Style", "Palatino", Georgia, serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
    --ink-900:#1A1612; --ink-700:#3D342C; --ink-500:#6B5F54;
    --ink-300:#A89E93; --ink-100:#E8E3DD;
    --paper-50:#FAF7F2; --paper-100:#F3EEE5; --paper-200:#EBE3D6;
    --ember-600:#C8532B; --ember-500:#E26340; --ember-100:#FBEAE0;
    --sage-600:#4A7C59; --sage-100:#E4EEE6;
    --amber-600:#B8860B; --amber-100:#F5ECD5;
    --crimson-600:#9A2E2E; --crimson-100:#F2DCDC;
  }
  html, body { margin:0; padding:0; }
  body { background:#EFEAE1; font-family:var(--font-sans); color:var(--ink-900);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  .mock-page { min-height:100vh; padding:48px 32px 80px; }
  .mock-header { max-width:1600px; margin:0 auto 40px; }
  .mock-title { font-family:var(--font-serif); font-weight:600; font-size:40px;
    letter-spacing:-0.02em; line-height:1.1; color:var(--ink-900); margin:0; }
  .mock-sub { font-size:15px; color:#6B5F54; margin:8px 0 0; max-width:780px; line-height:1.55; }
  .mock-sub em { color:#3D342C; font-style:italic; }
  .mock-meta { display:flex; gap:10px; flex-wrap:wrap; margin-top:20px;
    font-size:11px; color:#6B5F54; letter-spacing:0.06em; text-transform:uppercase; }
  .mock-meta span { padding:4px 10px; background:#E8E3DD; border-radius:999px; }
  .mock-main { max-width:1600px; margin:0 auto; }
  .mock-section { margin-top:56px; padding-top:24px; border-top:1px solid #D9D2C4; }
  .mock-section:first-of-type { border-top:none; padding-top:0; margin-top:24px; }
  .mock-section-title { font-family:var(--font-serif); font-weight:600;
    font-size:24px; letter-spacing:-0.01em; color:var(--ink-900); margin:0; }
  .mock-section-desc { font-size:14px; color:#6B5F54; margin:6px 0 0;
    max-width:760px; line-height:1.55; }
  .mock-row { display:flex; flex-wrap:wrap; gap:36px; margin-top:24px; align-items:flex-start; }
  .mock-cell { display:flex; flex-direction:column; gap:10px; }
  .mock-cell-label { font-size:11px; font-weight:600; letter-spacing:0.14em;
    text-transform:uppercase; color:#6B5F54; }
  .mock-cell-caption { font-size:12px; line-height:1.5; color:#6B5F54;
    max-width:410px; margin-top:2px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const STIR_LIGHT = { bg:'#FAF7F2', paper100:'#F3EEE5', paper200:'#EBE3D6',
  ink900:'#1A1612', ink700:'#3D342C', ink500:'#6B5F54', ink300:'#A89E93',
  ink100:'#E8E3DD', ember:'#C8532B', emberHover:'#E26340', emberTint:'#FBEAE0',
  sage:'#4A7C59', sageTint:'#E4EEE6', amber:'#B8860B', amberTint:'#F5ECD5',
  crimson:'#9A2E2E', crimsonTint:'#F2DCDC' };
const STIR_DARK = { bg:'#14100B', paper100:'#1F1A14', paper200:'#2A241C',
  ink900:'#F5F0E8', ink700:'#D6CEC3', ink500:'#9A8F84', ink300:'#5E5349',
  ink100:'#2E2822', ember:'#E26340', emberHover:'#F07D5A', emberTint:'#3A1E13',
  sage:'#6FA07C', sageTint:'#1E2E23', amber:'#D4A21F', amberTint:'#2E2614',
  crimson:'#C94747', crimsonTint:'#2E1818' };
const useStir = (d) => d ? STIR_DARK : STIR_LIGHT;

const SF = {
  camera:   (c, s=20) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="6" width="20" height="14" rx="2.5"/><circle cx="12" cy="13" r="4"/><path d="M7 6l2-3h6l2 3"/></svg>,
  bookmark: (c, s=20, fill=false) => <svg width={s} height={s} viewBox="0 0 24 24" fill={fill?c:"none"} stroke={c} strokeWidth="1.7" strokeLinejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>,
  gear:     (c, s=20) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19 15l1.5 1-1 2-2-.5M5 15l-1.5 1 1 2 2-.5M19 9l1.5-1-1-2-2 .5M5 9l-1.5-1 1-2 2 .5M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>,
  fork:     (c, s=20) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M6 2v8a2 2 0 002 2v10M10 2v8M6 2h4M18 2c0 4-2 6-2 10v10M18 2s2 2 2 6-2 4-2 4"/></svg>,
  timer:    (c, s=20) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 8v5l3 2M9 2h6"/></svg>,
  chevronR: (c, s=14) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 6l6 6-6 6"/></svg>,
  arrowR:   (c, s=18) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>,
  wifi:     (c, s=14) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.7" strokeLinecap="round"><path d="M2 9c6-6 14-6 20 0M5 13c4.5-4.5 10-4.5 14.5 0M8.5 16.5c2.5-2.5 5-2.5 7.5 0"/><circle cx="12" cy="20" r="1" fill={c}/></svg>,
  wifiSlash:(c, s=14) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.7" strokeLinecap="round"><path d="M2 9c2.5-2.5 5.5-4 9-4.7M14 4.4c2.8.5 5.5 2 8 4.6M5 13c2-2 4.3-3.2 7-3.6M13.5 9.5c2 .3 4 1.4 5.5 3.5M8.5 16.5c1-1 2-1.7 3.5-2M12 20v.01"/><path d="M3 3l18 18" stroke={c} strokeWidth="2"/></svg>,
  cloudOff: (c, s=16) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M7 19a5 5 0 01-1-9.9 6 6 0 0110.5-2.5M20 16.5A5 5 0 0018 8"/><path d="M3 3l18 18" strokeWidth="2"/></svg>,
  sparkles: (c, s=16) => <svg width={s} height={s} viewBox="0 0 24 24" fill={c}><path d="M12 2l1.8 4.2L18 8l-4.2 1.8L12 14l-1.8-4.2L6 8l4.2-1.8zM20 14l.9 2.1L23 17l-2.1.9L20 20l-.9-2.1L17 17l2.1-.9zM5 14l.9 2.1L8 17l-2.1.9L5 20l-.9-2.1L2 17l2.1-.9z"/></svg>,
  clock:    (c, s=14) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.7" strokeLinecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>,
  alert:    (c, s=16) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3L2 21h20z"/><path d="M12 10v4M12 17v.01"/></svg>,
};

function StirStatusBar({ dark, time='7:42', offline=false }) {
  const c = dark ? '#F5F0E8' : '#1A1612';
  return (
    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center',
      padding:'14px 28px 6px', fontFamily:'var(--font-sans)', fontWeight:600, fontSize:15,
      color:c, height:44, boxSizing:'border-box' }}>
      <span style={{ letterSpacing:0.2 }}>{time}</span>
      <div style={{ display:'flex', gap:6, alignItems:'center' }}>
        {offline
          ? <svg width="16" height="10" viewBox="0 0 16 10"><rect x="0" y="7" width="2.5" height="3" rx="0.5" fill={c} opacity="0.35"/><rect x="4" y="5" width="2.5" height="5" rx="0.5" fill={c} opacity="0.35"/><rect x="8" y="3" width="2.5" height="7" rx="0.5" fill={c} opacity="0.35"/><rect x="12" y="1" width="2.5" height="9" rx="0.5" fill={c} opacity="0.35"/></svg>
          : <svg width="16" height="10" viewBox="0 0 16 10"><rect x="0" y="7" width="2.5" height="3" rx="0.5" fill={c}/><rect x="4" y="5" width="2.5" height="5" rx="0.5" fill={c}/><rect x="8" y="3" width="2.5" height="7" rx="0.5" fill={c}/><rect x="12" y="1" width="2.5" height="9" rx="0.5" fill={c}/></svg>}
        {offline ? SF.wifiSlash(c, 14) : SF.wifi(c, 14)}
        <svg width="24" height="12" viewBox="0 0 24 12"><rect x="0.5" y="0.5" width="20" height="11" rx="3" fill="none" stroke={c} strokeOpacity="0.45"/><rect x="2" y="2" width="11" height="8" rx="1.5" fill={c}/><rect x="21" y="4" width="2" height="4" rx="1" fill={c} opacity="0.45"/></svg>
      </div>
    </div>
  );
}

function StirTabBar({ active='tonight', dark }) {
  const c = useStir(dark);
  const items = [
    { key:'tonight', label:'Tonight', icon: SF.fork },
    { key:'saved', label:'Saved', icon: (col, s) => SF.bookmark(col, s, active==='saved') },
    { key:'settings', label:'Settings', icon: SF.gear },
  ];
  return (
    <div style={{ borderTop:`1px solid ${c.ink100}`, background:c.bg,
      padding:'8px 0 24px', display:'flex', justifyContent:'space-around' }}>
      {items.map(it => {
        const on = it.key === active;
        const col = on ? c.ember : c.ink500;
        return (
          <div key={it.key} style={{ display:'flex', flexDirection:'column',
            alignItems:'center', gap:4, minWidth:64 }}>
            {it.icon(col, 22)}
            <span style={{ fontSize:11, fontWeight:500, color:col, letterSpacing:0.1 }}>{it.label}</span>
          </div>
        );
      })}
    </div>
  );
}

function StirFrame({ children, dark=false, time='7:42', showTab=true,
                     activeTab='tonight', offline=false, width=390, height=844 }) {
  const c = useStir(dark);
  return (
    <div style={{ width:width+12, height:height+12, padding:6, boxSizing:'border-box',
      background: dark ? '#0a0805' : '#f7f3ec', borderRadius:54,
      boxShadow:`0 2px 0 ${dark?'#2a2520':'#e8e1d4'} inset, 0 30px 60px rgba(26,22,18,0.18)` }}>
      <div style={{ width, height, borderRadius:48, background:c.bg, overflow:'hidden',
        position:'relative', fontFamily:'var(--font-sans)', color:c.ink900 }}>
        <div style={{ position:'absolute', top:10, left:'50%', transform:'translateX(-50%)',
          width:120, height:34, borderRadius:20, background:'#000', zIndex:100 }} />
        <StirStatusBar dark={dark} time={time} offline={offline} />
        <div style={{ height: height - 44 - (showTab ? 78 : 0),
          overflow:'hidden', display:'flex', flexDirection:'column' }}>
          {children}
        </div>
        {showTab && <StirTabBar active={activeTab} dark={dark} />}
        <div style={{ position:'absolute', bottom:8, left:'50%', transform:'translateX(-50%)',
          width:134, height:5, borderRadius:999, background: dark ? '#F5F0E8' : '#1A1612', opacity:0.4 }} />
      </div>
    </div>
  );
}

Object.assign(window, { StirFrame, SF, useStir });
</script>

<!-- ========== Tonight Home screens ========== -->
<script type="text/babel">
const { StirFrame, SF, useStir } = window;

/* Shared placeholder plate — illustrated, not a photo */
function Plate({ c, size=200 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="88" fill={c.paper200} stroke={c.ink100} strokeWidth="1"/>
      <circle cx="100" cy="100" r="76" fill={c.paper100} stroke={c.ink100} strokeWidth="1"/>
      {/* salmon */}
      <path d="M54 95 Q62 80 86 78 Q110 76 124 88 Q136 100 126 114 Q112 128 88 128 Q64 128 54 112 Z"
        fill={c.ember} opacity="0.88"/>
      <path d="M60 98 Q72 88 94 88 M64 108 Q78 104 96 108 M66 116 Q80 118 92 118"
        stroke={c.emberTint} strokeWidth="1.5" fill="none" strokeLinecap="round"/>
      {/* greens */}
      <circle cx="138" cy="86" r="10" fill={c.sage} opacity="0.8"/>
      <circle cx="148" cy="98" r="7" fill={c.sage} opacity="0.9"/>
      <circle cx="140" cy="110" r="8" fill={c.sage} opacity="0.75"/>
      {/* lemon */}
      <circle cx="132" cy="130" r="9" fill={c.amber} opacity="0.85"/>
      <circle cx="132" cy="130" r="9" fill="none" stroke={c.paper50 || '#fff8ea'} strokeWidth="1" strokeDasharray="2 2" opacity="0.5"/>
      {/* rice grains */}
      {[...Array(14)].map((_,i) => (
        <ellipse key={i}
          cx={78 + (i%5)*6 + (Math.floor(i/5)%2)*3}
          cy={140 + Math.floor(i/5)*5}
          rx="2.5" ry="1.5" fill={c.ink100} opacity="0.7"/>
      ))}
      {/* sesame */}
      <circle cx="90" cy="96" r="1.2" fill={c.ink700}/>
      <circle cx="106" cy="104" r="1.2" fill={c.ink700}/>
      <circle cx="114" cy="94" r="1.2" fill={c.ink700}/>
    </svg>
  );
}

/* ---------- Tonight — Default (catalog #7) ---------- */
function TonightDefault({ dark=false, useSoon=false }) {
  const c = useStir(dark);
  return (
    <div style={{ flex:1, background:c.bg, display:'flex', flexDirection:'column' }}>

      {/* Greeting */}
      <div style={{ padding:'12px 20px 8px', display:'flex',
        alignItems:'flex-end', justifyContent:'space-between' }}>
        <div>
          <div style={{ fontFamily:'var(--font-serif)', fontWeight:600, fontSize:30,
            lineHeight:'36px', letterSpacing:'-0.02em', color:c.ink900 }}>Tonight</div>
          <div style={{ fontSize:14, color:c.ink500, marginTop:2 }}>
            Wednesday · 7:42 PM
          </div>
        </div>
        <div style={{ width:40, height:40, borderRadius:999, background:c.paper200,
          display:'flex', alignItems:'center', justifyContent:'center',
          border:`1px solid ${c.ink100}` }}>
          {SF.bookmark(c.ink700, 18)}
        </div>
      </div>

      <div style={{ flex:1, overflow:'hidden', padding:'8px 16px 12px' }}>

        {/* Hero meal card */}
        <div style={{ background:c.paper100, borderRadius:20,
          border:`1px solid ${c.ink100}`, overflow:'hidden' }}>
          <div style={{ background:c.paper200, padding:'18px 0 6px',
            display:'flex', justifyContent:'center', position:'relative' }}>
            {/* Confidence badge */}
            <div style={{ position:'absolute', top:12, left:12,
              background:c.bg, borderRadius:999, padding:'4px 10px 4px 8px',
              fontSize:11, fontWeight:600, color:c.sage, letterSpacing:0.1,
              display:'flex', alignItems:'center', gap:4,
              border:`1px solid ${c.sageTint}` }}>
              <div style={{ width:6, height:6, borderRadius:999, background:c.sage }} />
              HIGH MATCH
            </div>
            <div style={{ position:'absolute', top:12, right:12, fontSize:11,
              color:c.ink500, fontWeight:500, letterSpacing:0.06*11/11+'em', textTransform:'uppercase' }}>
              Solved 3 min ago
            </div>
            <Plate c={c} size={180} />
          </div>

          <div style={{ padding:'14px 18px 18px' }}>
            <div style={{ fontSize:12, fontWeight:600, color:c.ember,
              letterSpacing:'0.14em', textTransform:'uppercase' }}>Tonight's pick</div>
            <h3 style={{ fontFamily:'var(--font-serif)', fontWeight:600, fontSize:22,
              lineHeight:'28px', letterSpacing:'-0.015em', color:c.ink900,
              margin:'6px 0 8px', textWrap:'balance' }}>
              Miso-Glazed Salmon with Sesame Rice
            </h3>

            <div style={{ display:'flex', gap:14, marginTop:4, marginBottom:12,
              fontSize:13, color:c.ink500 }}>
              <div style={{ display:'flex', alignItems:'center', gap:4 }}>
                {SF.clock(c.ink500, 13)}<span><b style={{ color:c.ink700, fontWeight:600 }}>22 min</b></span>
              </div>
              <div>·</div>
              <div><b style={{ color:c.ink700, fontWeight:600 }}>4 servings</b></div>
              <div>·</div>
              <div><b style={{ color:c.ink700, fontWeight:600 }}>1 pan</b></div>
            </div>

            <div style={{ display:'flex', flexWrap:'wrap', gap:6, marginBottom:14 }}>
              {['pescatarian', 'nut-free', 'quick'].map(t => (
                <div key={t} style={{ padding:'4px 10px', background:c.sageTint,
                  color:c.sage, fontSize:12, fontWeight:500, borderRadius:999 }}>{t}</div>
              ))}
            </div>

            {useSoon && (
              <div style={{ background:c.amberTint,
                border:`1px solid ${c.amber}`, borderRadius:12,
                padding:'10px 12px', marginBottom:14, display:'flex', gap:10, alignItems:'flex-start' }}>
                {SF.alert(c.amber, 16)}
                <div style={{ fontSize:13, lineHeight:'18px', color:c.ink900 }}>
                  <b style={{ fontWeight:600 }}>Uses soon:</b> salmon fillets (exp. tomorrow),
                  scallions (exp. in 2 days)
                </div>
              </div>
            )}

            <button style={{ width:'100%', height:52, borderRadius:12, border:0,
              background:c.ember, color:'#fff', fontSize:17, fontWeight:600,
              letterSpacing:'-0.01em', display:'flex', alignItems:'center',
              justifyContent:'center', gap:8, cursor:'pointer' }}>
              Start cooking {SF.arrowR('#fff', 18)}
            </button>

            <div style={{ display:'flex', gap:8, marginTop:10 }}>
              <button style={{ flex:1, height:40, borderRadius:10,
                background:'transparent', border:`1px solid ${c.ink100}`,
                fontSize:14, fontWeight:500, color:c.ink700, cursor:'pointer' }}>
                Other options
              </button>
              <button style={{ flex:1, height:40, borderRadius:10,
                background:'transparent', border:`1px solid ${c.ink100}`,
                fontSize:14, fontWeight:500, color:c.ink700, cursor:'pointer' }}>
                Save for later
              </button>
            </div>
          </div>
        </div>

        {/* Secondary actions */}
        <div style={{ marginTop:16, display:'flex', gap:10 }}>
          <div style={{ flex:1, padding:'14px 14px', borderRadius:14,
            background:c.paper100, border:`1px solid ${c.ink100}`,
            display:'flex', alignItems:'center', gap:10 }}>
            {SF.camera(c.ember, 20)}
            <div style={{ flex:1 }}>
              <div style={{ fontSize:14, fontWeight:600, color:c.ink900 }}>Re-scan</div>
              <div style={{ fontSize:12, color:c.ink500 }}>Last: 2 days ago</div>
            </div>
          </div>
          <div style={{ flex:1, padding:'14px 14px', borderRadius:14,
            background:c.paper100, border:`1px solid ${c.ink100}`,
            display:'flex', alignItems:'center', gap:10 }}>
            {SF.sparkles(c.ember, 20)}
            <div style={{ flex:1 }}>
              <div style={{ fontSize:14, fontWeight:600, color:c.ink900 }}>Solve again</div>
              <div style={{ fontSize:12, color:c.ink500 }}>Different idea</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------- Tonight — First-use empty (catalog #8) ---------- */
function TonightEmpty({ dark=false }) {
  const c = useStir(dark);
  return (
    <div style={{ flex:1, background:c.bg, display:'flex', flexDirection:'column' }}>

      <div style={{ padding:'12px 20px 8px' }}>
        <div style={{ fontFamily:'var(--font-serif)', fontWeight:600, fontSize:30,
          lineHeight:'36px', letterSpacing:'-0.02em', color:c.ink900 }}>Tonight</div>
        <div style={{ fontSize:14, color:c.ink500, marginTop:2 }}>
          Wednesday · 7:42 PM
        </div>
      </div>

      <div style={{ flex:1, padding:'16px 20px 20px', display:'flex',
        flexDirection:'column', justifyContent:'space-between' }}>

        {/* Empty hero */}
        <div style={{
          background:c.paper100, borderRadius:20, border:`1.5px dashed ${c.ink300}`,
          padding:'40px 24px 32px', textAlign:'center',
          display:'flex', flexDirection:'column', alignItems:'center', gap:14, marginTop:20 }}>

          {/* Scan glyph */}
          <div style={{ width:80, height:80, borderRadius:20, background:c.emberTint,
            display:'flex', alignItems:'center', justifyContent:'center' }}>
            {SF.camera(c.ember, 36)}
          </div>

          <div>
            <div style={{ fontFamily:'var(--font-serif)', fontWeight:600, fontSize:22,
              lineHeight:'28px', letterSpacing:'-0.015em', color:c.ink900 }}>
              Let's see what you've got.
            </div>
