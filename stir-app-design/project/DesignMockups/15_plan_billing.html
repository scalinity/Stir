function Bar({dark}){const c=dark?'#F5F0E8':'#1A1612';return(<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'0 28px',fontWeight:600,fontSize:15,color:c,height:44}}><span>6:44</span><div style={{display:'flex',gap:6,alignItems:'center'}}><svg width="16" height="10" viewBox="0 0 16 10"><rect x="0" y="7" width="2.5" height="3" rx="0.5" fill={c}/><rect x="4" y="5" width="2.5" height="5" rx="0.5" fill={c}/><rect x="8" y="3" width="2.5" height="7" rx="0.5" fill={c}/><rect x="12" y="1" width="2.5" height="9" rx="0.5" fill={c}/></svg>{SF.wifi(c)}<svg width="24" height="12" viewBox="0 0 24 12"><rect x="0.5" y="0.5" width="20" height="11" rx="3" fill="none" stroke={c} strokeOpacity="0.45"/><rect x="2" y="2" width="11" height="8" rx="1.5" fill={c}/><rect x="21" y="4" width="2" height="4" rx="1" fill={c} opacity="0.45"/></svg></div></div>);}

/* 1) Plan overview (current Pro) */

          {t:'Solves',v:'47',s:'Unlimited on Pro'},
          {t:'Imports',v:'12',s:'9 links · 3 scans'},

        ].map((r,i)=><div key={r.t} style={{display:'flex',alignItems:'center',gap:10,padding:'12px 14px',borderTop:i===0?'none':`1px solid ${c.ink100}`}}>

      <div style={{marginTop:20,fontSize:10,fontWeight:700,letterSpacing:'0.14em',textTransform:'uppercase',color:c.ink500,marginBottom:8}}>Manage</div>
      <div style={{background:c.paper100,borderRadius:14,border:`1px solid ${c.ink100}`,overflow:'hidden'}}>

/* 3) Switch plan */
function SwitchPlan({dark=false}){

    {n:'Free',p:'$0',sub:'3 solves/day',feats:['Save & cook','Manual grocery','Light substitutions'],on:false},

  ];
  return(<div style={{flex:1,background:c.bg,display:'flex',flexDirection:'column',minHeight:0,overflow:'hidden'}}>
    <div style={{padding:'8px 20px 10px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
      <button style={{width:36,height:36,borderRadius:999,background:c.paper200,border:0,display:'flex',alignItems:'center',justifyContent:'center'}}>{SF.back(c.ink700,16)}</button>
      <div style={{fontSize:14,fontWeight:600,color:c.ink900}}>Switch plan</div>
      <div style={{width:36}}/>

    <div style={{flex:1,overflow:'auto',padding:'0 20px 24px'}}>
      <div style={{padding:'8px 0 16px'}}>

        <div style={{fontSize:13,color:c.ink500,marginTop:4}}>Change anytime. Credited prorated.</div>

      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {plans.map(p=><div key={p.n} style={{padding:'16px 18px',borderRadius:16,background:p.cur?c.emberTint:c.paper100,border:`${p.cur?1.5:1}px solid ${p.cur?c.ember:c.ink100}`,position:'relative'}}>

/* 4) Cancel flow */

    <div style={{padding:'12px 20px 20px',display:'flex',gap:10,borderTop:`1px solid ${c.ink100}`,flexShrink:0,background:c.bg}}>
