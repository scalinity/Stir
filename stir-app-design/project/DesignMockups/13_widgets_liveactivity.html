<!DOCTYPE html>
<html lang="en">

  .mock-meta span{padding:4px 10px;background:#E8E3DD;border-radius:999px}.mock-main{max-width:1600px;margin:0 auto}

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const L={bg:'#FAF7F2',paper100:'#F3EEE5',paper200:'#EBE3D6',ink900:'#1A1612',ink700:'#3D342C',ink500:'#6B5F54',ink300:'#A89E93',ink100:'#E8E3DD',ember:'#C8532B',emberTint:'#FBEAE0',sage:'#4A7C59',sageTint:'#E4EEE6',amber:'#B8860B',amberTint:'#F5ECD5'};
const D={bg:'#14100B',paper100:'#1F1A14',paper200:'#2A241C',ink900:'#F5F0E8',ink700:'#D6CEC3',ink500:'#9A8F84',ink300:'#5E5349',ink100:'#2E2822',ember:'#E26340',emberTint:'#3A1E13',sage:'#6FA07C',sageTint:'#1E2E23',amber:'#D4A21F',amberTint:'#2E2614'};
const u=(d)=>d?D:L;

/* ============ WIDGETS ============
   iOS Home Screen widget sizes @ 3x:
   Small: 158×158   Medium: 338×158   Large: 338×354
*/

const SF = {
  stir:(c,s=14)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round"><ellipse cx="12" cy="16" rx="8" ry="3"/><path d="M15 6l2 10M13 4a2 2 0 014 0v2"/></svg>,
  flame:(c,s=14)=><svg width={s} height={s} viewBox="0 0 24 24" fill={c}><path d="M12 2c1.5 3.5 4 5.5 4 9a6 6 0 01-12 0c0-2.2 1-3.2 2-4 0 2 .5 3 2 3 0-3 1.5-5 4-8z"/></svg>,
  clock:(c,s=14)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>,
  chev:(c,s=10)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2.5" strokeLinecap="round"><path d="M9 6l6 6-6 6"/></svg>,
  play:(c,s=12)=><svg width={s} height={s} viewBox="0 0 24 24" fill={c}><path d="M7 4v16l14-8z"/></svg>,
  pause:(c,s=12)=><svg width={s} height={s} viewBox="0 0 24 24" fill={c}><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>,
  check:(c,s=12)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2.8" strokeLinecap="round"><path d="M5 12l4 4 10-10"/></svg>,
  cart:(c,s=12)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M3 4h2l2.4 12.6a1.5 1.5 0 001.5 1.2h9.4a1.5 1.5 0 001.5-1.1L21 9H6"/><circle cx="9" cy="21" r="1.2"/><circle cx="18" cy="21" r="1.2"/></svg>,
  bolt:(c,s=12)=><svg width={s} height={s} viewBox="0 0 24 24" fill={c}><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>,
  wifi:(c,s=12)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round"><path d="M2 9c6-6 14-6 20 0M5 13c4.5-4.5 10-4.5 14.5 0M8.5 16.5c2.5-2.5 5-2.5 7.5 0"/><circle cx="12" cy="20" r="1" fill={c}/></svg>,
};

/* ============ SMALL WIDGET — Tonight ============ */
function WidgetSmallTonight({dark=false}){
  const c=u(dark);
  return(<div style={{width:158,height:158,borderRadius:22,background:c.bg,padding:14,position:'relative',boxShadow:dark?'0 10px 30px rgba(0,0,0,0.55)':'0 10px 30px rgba(26,22,18,0.15)',fontFamily:'var(--font-sans)',color:c.ink900,overflow:'hidden'}}>
    <div style={{display:'flex',alignItems:'center',gap:5,opacity:0.75}}>
      <div style={{width:14,height:14,borderRadius:4,background:c.ember,display:'flex',alignItems:'center',justifyContent:'center'}}>{SF.stir('#fff',10)}</div>
      <div style={{fontSize:9,fontWeight:700,letterSpacing:'0.12em',textTransform:'uppercase',color:c.ink500}}>Tonight</div>
    </div>
    <div style={{fontFamily:'var(--font-serif)',fontSize:17,fontWeight:600,letterSpacing:'-0.01em',lineHeight:'20px',color:c.ink900,marginTop:8}}>
      Miso-Glazed Salmon
    </div>
    <div style={{fontSize:10,color:c.ink500,marginTop:3}}>
      28 min · uses pantry
    </div>
    <div style={{position:'absolute',left:14,right:14,bottom:12,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
      <div style={{display:'flex',alignItems:'center',gap:4,fontSize:10,color:c.ember,fontWeight:700,letterSpacing:'0.06em',textTransform:'uppercase'}}>
        Start cook {SF.chev(c.ember,8)}
      </div>
    </div>
  </div>);
}

/* ============ SMALL WIDGET — Grocery ============ */
function WidgetSmallGrocery({dark=false}){
  const c=u(dark);
  return(<div style={{width:158,height:158,borderRadius:22,background:c.bg,padding:14,position:'relative',boxShadow:dark?'0 10px 30px rgba(0,0,0,0.55)':'0 10px 30px rgba(26,22,18,0.15)',fontFamily:'var(--font-sans)',color:c.ink900,overflow:'hidden'}}>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
      <div style={{fontSize:9,fontWeight:700,letterSpacing:'0.12em',textTransform:'uppercase',color:c.ink500}}>Grocery</div>
      <div style={{fontSize:9,color:c.ember,fontWeight:700}}>11</div>
    </div>
    <div style={{marginTop:8,display:'flex',flexDirection:'column',gap:4}}>
      {['Salmon fillets','Asparagus','Mirin','Lacinato kale','Parmesan'].map((t,i)=>
        <div key={i} style={{display:'flex',alignItems:'center',gap:5,fontSize:10.5,color:i<2?c.ink900:c.ink500}}>
          <div style={{width:8,height:8,borderRadius:2,border:`1.2px solid ${i<1?c.sage:c.ink300}`,background:i<1?c.sage:'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            {i<1 && SF.check('#fff',7)}
          </div>
          <span style={{textDecoration:i<1?'line-through':'none',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{t}</span>
        </div>)}
    </div>
    <div style={{position:'absolute',left:14,right:14,bottom:12,fontSize:9,color:c.ink500}}>+6 more · tap to open</div>
  </div>);
}

/* ============ SMALL WIDGET — Pantry alert ============ */
function WidgetSmallPantry({dark=false}){
  const c=u(dark);
  return(<div style={{width:158,height:158,borderRadius:22,background:c.amberTint,padding:14,position:'relative',boxShadow:dark?'0 10px 30px rgba(0,0,0,0.55)':'0 10px 30px rgba(26,22,18,0.15)',fontFamily:'var(--font-sans)',color:c.ink900,overflow:'hidden'}}>
    <div style={{fontSize:9,fontWeight:700,letterSpacing:'0.12em',textTransform:'uppercase',color:c.amber,display:'flex',alignItems:'center',gap:4}}>
      {SF.bolt(c.amber,10)} Running low
    </div>
    <div style={{fontFamily:'var(--font-serif)',fontSize:34,fontWeight:600,letterSpacing:'-0.02em',color:c.ink900,marginTop:10,lineHeight:1}}>4</div>
    <div style={{fontSize:11,color:c.ink700,marginTop:2}}>pantry items</div>
    <div style={{marginTop:10,display:'flex',flexDirection:'column',gap:3,fontSize:10,color:c.ink500}}>
      <div>Soy sauce · ~3 tbsp</div>
      <div>Pastina · low</div>
      <div>Eggs · 4 left</div>
    </div>
  </div>);
}

/* ============ MEDIUM WIDGET — Tonight (rich) ============ */
function WidgetMediumTonight({dark=false}){
  const c=u(dark);
  return(<div style={{width:338,height:158,borderRadius:22,background:c.bg,padding:16,position:'relative',boxShadow:dark?'0 10px 30px rgba(0,0,0,0.55)':'0 10px 30px rgba(26,22,18,0.15)',fontFamily:'var(--font-sans)',color:c.ink900,overflow:'hidden',display:'flex',gap:14}}>
    {/* Left text */}
    <div style={{flex:1,display:'flex',flexDirection:'column'}}>
      <div style={{display:'flex',alignItems:'center',gap:5,opacity:0.75}}>
        <div style={{width:14,height:14,borderRadius:4,background:c.ember,display:'flex',alignItems:'center',justifyContent:'center'}}>{SF.stir('#fff',10)}</div>
        <div style={{fontSize:9,fontWeight:700,letterSpacing:'0.12em',textTransform:'uppercase',color:c.ink500}}>Tonight · 6:44</div>
      </div>
      <div style={{fontFamily:'var(--font-serif)',fontSize:21,fontWeight:600,letterSpacing:'-0.01em',lineHeight:'25px',color:c.ink900,marginTop:8}}>
        Miso-Glazed Salmon with Asparagus & Rice
      </div>
      <div style={{marginTop:'auto',display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
        <div style={{fontSize:10,color:c.sage,fontWeight:700,letterSpacing:'0.06em',textTransform:'uppercase',padding:'3px 7px',background:c.sageTint,borderRadius:999}}>Uses pantry</div>
        <div style={{fontSize:10,color:c.ink500}}>28 min · 2 serves</div>
      </div>
    </div>
    {/* Right CTA */}
    <div style={{width:100,background:c.ember,borderRadius:14,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:6}}>
      <div style={{width:32,height:32,borderRadius:999,background:'rgba(255,255,255,0.2)',display:'flex',alignItems:'center',justifyContent:'center'}}>{SF.play('#fff',14)}</div>
      <div style={{fontSize:10,fontWeight:700,letterSpacing:'0.12em',textTransform:'uppercase',color:'#fff'}}>Start cook</div>
    </div>
  </div>);
}

/* ============ LARGE WIDGET — Week Plan ============ */
function WidgetLargeWeek({dark=false}){
  const c=u(dark);
  const days=[
    {d:'Tue',meal:'Miso-Glazed Salmon',tag:'Tonight',icon:'🐟',active:true},
    {d:'Wed',meal:'Kale & Farro Salad',tag:null,icon:'🥬'},
    {d:'Thu',meal:'Leftover salmon bowls',tag:'Auto',icon:'🍚'},
    {d:'Fri',meal:'Turkey Meatball Soup',tag:null,icon:'🍲'},
    {d:'Sat',meal:'Tap to plan',tag:null,icon:null,empty:true},
  ];
  return(<div style={{width:338,height:354,borderRadius:22,background:c.bg,padding:18,position:'relative',boxShadow:dark?'0 10px 30px rgba(0,0,0,0.55)':'0 10px 30px rgba(26,22,18,0.15)',fontFamily:'var(--font-sans)',color:c.ink900,overflow:'hidden'}}>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
      <div style={{display:'flex',alignItems:'center',gap:6}}>
        <div style={{width:16,height:16,borderRadius:4,background:c.ember,display:'flex',alignItems:'center',justifyContent:'center'}}>{SF.stir('#fff',11)}</div>
        <div style={{fontSize:10,fontWeight:700,letterSpacing:'0.12em',textTransform:'uppercase',color:c.ink500}}>This week</div>
      </div>
      <div style={{fontSize:10,color:c.ink500}}>4 of 5 planned</div>
    </div>

    <div style={{marginTop:14,display:'flex',flexDirection:'column',gap:6}}>
      {days.map((d,i)=>
        <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 10px',background:d.active?c.emberTint:(d.empty?'transparent':c.paper100),borderRadius:11,border:d.active?`1px solid ${c.ember}44`:(d.empty?`1px dashed ${c.ink300}`:'none')}}>
          <div style={{fontSize:10,fontWeight:700,letterSpacing:'0.08em',textTransform:'uppercase',color:d.active?c.ember:c.ink500,width:28}}>{d.d}</div>
          {d.icon ? <div style={{width:22,height:22,borderRadius:6,background:c.bg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:13}}>{d.icon}</div> : <div style={{width:22,height:22}}/>}
          <div style={{flex:1,fontSize:12,fontWeight:d.active?600:500,color:d.empty?c.ink500:c.ink900,fontStyle:d.empty?'italic':'normal',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{d.meal}</div>
          {d.tag && <div style={{fontSize:9,fontWeight:700,letterSpacing:'0.08em',textTransform:'uppercase',color:d.active?c.ember:c.ink500,padding:'2px 6px',background:c.bg,borderRadius:999}}>{d.tag}</div>}
        </div>
      )}
    </div>

    <div style={{position:'absolute',left:18,right:18,bottom:14,display:'flex',alignItems:'center',justifyContent:'space-between',fontSize:10,color:c.ink500,paddingTop:10,borderTop:`1px solid ${c.ink100}`}}>
      <div style={{display:'flex',alignItems:'center',gap:4}}>{SF.cart(c.ink500,11)} 11 grocery items</div>
      <div style={{color:c.ember,fontWeight:700,display:'flex',alignItems:'center',gap:3}}>Open plan {SF.chev(c.ember,8)}</div>
    </div>
  </div>);
}

/* ============ WIDGET HOST — iOS Home Screen ============ */
function WidgetHost({children,dark=false}){
  // iOS home-screen-ish wallpaper
  const bg = dark
    ? 'linear-gradient(160deg, #2a2420 0%, #1a1511 40%, #0c0a08 100%)'
    : 'linear-gradient(160deg, #d9c9a8 0%, #bca67c 50%, #8a7454 100%)';
  const c=u(dark);
  return(<div style={{width:402,height:856,padding:6,background:dark?'#0a0805':'#f7f3ec',borderRadius:54,boxShadow:`0 30px 60px rgba(26,22,18,0.18)`,boxSizing:'border-box'}}>
    <div style={{width:390,height:844,borderRadius:48,overflow:'hidden',position:'relative',background:bg,fontFamily:'var(--font-sans)',color:'#fff'}}>
      {/* Notch */}
      <div style={{position:'absolute',top:10,left:'50%',transform:'translateX(-50%)',width:120,height:34,borderRadius:20,background:'#000',zIndex:100}}/>
      {/* Status bar */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'0 28px',fontWeight:600,fontSize:15,color:'#fff',height:44,textShadow:'0 1px 2px rgba(0,0,0,0.3)'}}>
        <span>6:44</span>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          <svg width="16" height="10" viewBox="0 0 16 10"><rect x="0" y="7" width="2.5" height="3" rx="0.5" fill="#fff"/><rect x="4" y="5" width="2.5" height="5" rx="0.5" fill="#fff"/><rect x="8" y="3" width="2.5" height="7" rx="0.5" fill="#fff"/><rect x="12" y="1" width="2.5" height="9" rx="0.5" fill="#fff"/></svg>
          {SF.wifi('#fff',13)}
          <svg width="24" height="12" viewBox="0 0 24 12"><rect x="0.5" y="0.5" width="20" height="11" rx="3" fill="none" stroke="#fff" strokeOpacity="0.45"/><rect x="2" y="2" width="11" height="8" rx="1.5" fill="#fff"/><rect x="21" y="4" width="2" height="4" rx="1" fill="#fff" opacity="0.45"/></svg>
        </div>
      </div>

      {/* Clock header */}
      <div style={{textAlign:'center',marginTop:6,fontWeight:500,fontSize:22,letterSpacing:'-0.01em',textShadow:'0 1px 3px rgba(0,0,0,0.3)'}}>Tuesday · April 28</div>

      {/* Widget stage */}
      <div style={{position:'absolute',top:96,left:0,right:0,bottom:100,display:'flex',alignItems:'flex-start',justifyContent:'center',padding:'30px 16px'}}>
        {children}
      </div>

      {/* Dock */}
      <div style={{position:'absolute',left:12,right:12,bottom:16,height:78,borderRadius:28,background:'rgba(255,255,255,0.18)',backdropFilter:'blur(22px)',WebkitBackdropFilter:'blur(22px)',display:'flex',alignItems:'center',justifyContent:'space-around',padding:'0 12px'}}>
        {[{bg:'#0A7CFF',e:'📞'},{bg:'#34C759',e:'💬'},{bg:c.ember,e:null,stir:true},{bg:'#007AFF',e:'🎵'}].map((a,i)=>
          <div key={i} style={{width:54,height:54,borderRadius:14,background:a.bg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:24,boxShadow:'0 4px 8px rgba(0,0,0,0.15)'}}>
            {a.stir ? SF.stir('#fff',24) : a.e}
          </div>)}
      </div>

      {/* Home indicator */}
      <div style={{position:'absolute',bottom:8,left:'50%',transform:'translateX(-50%)',width:134,height:5,borderRadius:999,background:'#fff',opacity:0.5}}/>
    </div>
  </div>);
}

/* ============ LIVE ACTIVITY (Lock Screen) ============ */
function LiveActivityLS({dark=false,state='step'}){
  // Lock screen has a dark blurred wallpaper
  const isStep = state==='step';
  return(<div style={{width:354,borderRadius:22,background:'rgba(255,255,255,0.12)',backdropFilter:'blur(24px)',WebkitBackdropFilter:'blur(24px)',border:'1px solid rgba(255,255,255,0.12)',padding:'14px 16px',fontFamily:'var(--font-sans)',color:'#fff',position:'relative',overflow:'hidden'}}>
    <div style={{display:'flex',alignItems:'center',gap:8}}>
      <div style={{width:22,height:22,borderRadius:6,background:'#C8532B',display:'flex',alignItems:'center',justifyContent:'center'}}>{SF.stir('#fff',14)}</div>
      <div style={{flex:1}}>
        <div style={{fontSize:10,fontWeight:700,letterSpacing:'0.14em',textTransform:'uppercase',color:'rgba(255,255,255,0.7)'}}>Stir · cooking</div>
        <div style={{fontSize:13,fontWeight:600,color:'#fff',marginTop:1}}>Miso-Glazed Salmon</div>
      </div>
      <div style={{fontFamily:'var(--font-mono)',fontSize:18,fontWeight:600,color:'#fff',letterSpacing:'0.02em'}}>
        {isStep ? '03:42' : '00:28'}
      </div>
    </div>

    {isStep ? (
      <div style={{marginTop:10}}>
        <div style={{fontSize:10,fontWeight:700,letterSpacing:'0.12em',textTransform:'uppercase',color:'rgba(255,255,255,0.55)'}}>Step 3 of 6</div>
        <div style={{fontFamily:'var(--font-serif)',fontSize:16,fontWeight:500,color:'#fff',marginTop:4,lineHeight:'20px'}}>
          Broil salmon on top rack until glaze bubbles, 5 min.
        </div>
        <div style={{marginTop:10,height:4,borderRadius:2,background:'rgba(255,255,255,0.18)',overflow:'hidden'}}>
          <div style={{width:'58%',height:'100%',background:'#E26340',borderRadius:2}}/>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',marginTop:6,fontSize:10,color:'rgba(255,255,255,0.6)'}}>
          <span>Broiling</span>
          <span>2:52 left</span>
        </div>
      </div>
    ):(
      <div style={{marginTop:10,display:'flex',alignItems:'center',gap:12}}>
        <div style={{fontSize:11,color:'rgba(255,255,255,0.75)',flex:1}}>Timer — "Rest rice, covered"</div>
        <button style={{width:34,height:34,borderRadius:999,background:'rgba(255,255,255,0.2)',border:0,display:'flex',alignItems:'center',justifyContent:'center'}}>{SF.pause('#fff',14)}</button>
      </div>
    )}
  </div>);
}

/* ============ DYNAMIC ISLAND states ============ */
function IslandCompact({text='3:42',sub='Step 3'}){
  return(<div style={{width:390,display:'flex',justifyContent:'center',padding:'10px 0 0',position:'relative'}}>
    <div style={{display:'flex',alignItems:'center',background:'#000',borderRadius:28,padding:'6px 12px 6px 12px',gap:10,color:'#fff',minWidth:160,position:'relative'}}>
      <div style={{width:22,height:22,borderRadius:6,background:'#C8532B',display:'flex',alignItems:'center',justifyContent:'center'}}>{SF.stir('#fff',14)}</div>
      <div style={{fontFamily:'var(--font-mono)',fontSize:14,fontWeight:600}}>{text}</div>
      <div style={{width:1,height:14,background:'rgba(255,255,255,0.25)'}}/>
      <div style={{fontSize:11,color:'rgba(255,255,255,0.7)'}}>{sub}</div>
    </div>
