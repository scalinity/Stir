  cloud:(c,s=24)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M17.5 19a4.5 4.5 0 00.4-9 6 6 0 00-11.8.5A4.5 4.5 0 006.5 19h11zM4 4l16 16"/></svg>,

};
function Bar({dark,offline=false}){const c=dark?'#F5F0E8':'#1A1612';return(<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'0 28px',fontWeight:600,fontSize:15,color:c,height:44}}><span>6:44</span><div style={{display:'flex',gap:6,alignItems:'center'}}>{offline?<span style={{fontSize:11,fontWeight:600,color:c,opacity:0.6,letterSpacing:'0.04em'}}>No signal</span>:<svg width="16" height="10" viewBox="0 0 16 10"><rect x="0" y="7" width="2.5" height="3" rx="0.5" fill={c}/><rect x="4" y="5" width="2.5" height="5" rx="0.5" fill={c}/><rect x="8" y="3" width="2.5" height="7" rx="0.5" fill={c}/><rect x="12" y="1" width="2.5" height="9" rx="0.5" fill={c}/></svg>}{SF.wifi(c,14,offline)}<svg width="24" height="12" viewBox="0 0 24 12"><rect x="0.5" y="0.5" width="20" height="11" rx="3" fill="none" stroke={c} strokeOpacity="0.45"/><rect x="2" y="2" width="11" height="8" rx="1.5" fill={c}/><rect x="21" y="4" width="2" height="4" rx="1" fill={c} opacity="0.45"/></svg></div></div>);}

/* 1) Camera permission primer (pre-OS prompt) */
function PermCamera({dark=false}){
  const c=u(dark);
  return(<div style={{flex:1,background:c.bg,display:'flex',flexDirection:'column',minHeight:0,overflow:'hidden'}}>
    <div style={{flex:1,padding:'32px 28px 0',display:'flex',flexDirection:'column'}}>

          {SF.cam('#fff',26)}
        </div>
        {/* Scan corners on page */}
        <div style={{position:'absolute',inset:'16% 22%',borderRadius:4,border:`1.5px dashed ${c.ember}`,opacity:0.5}}/>
      </div>

      <div style={{fontFamily:'var(--font-serif)',fontSize:30,fontWeight:600,letterSpacing:'-0.02em',color:c.ink900,lineHeight:'36px',marginTop:28}}>
        Stir needs to see<br/>your cookbook.
      </div>
      <div style={{fontSize:14.5,color:c.ink500,marginTop:10,lineHeight:'22px'}}>Next you'll see iOS's camera permission prompt. Stir only uses the camera when you open a scan — never in the background.</div>

      <div style={{marginTop:20,padding:'12px 14px',background:c.paper100,borderRadius:12,border:`1px solid ${c.ink100}`,display:'flex',gap:10,alignItems:'flex-start'}}>

    <div style={{padding:'16px 20px 24px',display:'flex',flexDirection:'column',gap:10,flexShrink:0}}>

function PermDenied({dark=false}){
  const c=u(dark);

      <div style={{width:36}}/>
    </div>
    <div style={{flex:1,padding:'24px 28px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',textAlign:'center'}}>

/* 3) Offline — cooking mid-recipe */
function Offline({dark=false}){
  const c=u(dark);
  return(<div style={{flex:1,background:c.bg,display:'flex',flexDirection:'column',minHeight:0,overflow:'hidden'}}>
    {/* Persistent offline banner */}

    <div style={{padding:'8px 20px 10px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>

    <div style={{flex:1,overflow:'auto',padding:'0 20px 24px'}}>

/* 4) Import failed — recipe not found */
function ImportFailed({dark=false}){
  const c=u(dark);
  return(<div style={{flex:1,background:c.bg,display:'flex',flexDirection:'column',minHeight:0,overflow:'hidden'}}>
    <div style={{padding:'8px 20px 10px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
      <button style={{width:36,height:36,borderRadius:999,background:c.paper200,border:0,display:'flex',alignItems:'center',justifyContent:'center'}}>{SF.x(c.ink700,16)}</button>
      <div style={{fontSize:14,fontWeight:600,color:c.ink900}}>Import</div>
      <div style={{width:36}}/>
    </div>

    <div style={{flex:1,overflow:'auto',padding:'12px 20px 24px'}}>
      {/* URL being imported */}
      <div style={{padding:'10px 12px',background:c.paper100,borderRadius:10,border:`1px solid ${c.ink100}`,display:'flex',alignItems:'center',gap:8}}>
        <div style={{width:22,height:22,borderRadius:5,background:'#1A1612',color:'#fff',fontFamily:'var(--font-serif)',fontSize:11,fontWeight:600,display:'flex',alignItems:'center',justifyContent:'center'}}>NYT</div>
        <div style={{flex:1,fontFamily:'var(--font-mono)',fontSize:11.5,color:c.ink500,overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis'}}>nytimes.com/2024/…/chef-miso</div>
      </div>

      {/* Result card */}
      <div style={{marginTop:16,padding:'20px 18px',background:c.emberTint,borderRadius:16,border:`1px solid ${c.ember}33`}}>
        <div style={{display:'flex',gap:10,alignItems:'center'}}>

                <div style={{fontSize:11.5,color:c.ink500,marginTop:1}}>{x.s}</div>
