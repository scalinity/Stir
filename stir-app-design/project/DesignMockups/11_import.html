<script type="text/babel">

const SF={

  text:(c,s=18)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>,
  chev:(c,s=14)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 6l6 6-6 6"/></svg>,

function Bar({dark,time='6:44'}){const c=dark?'#F5F0E8':'#1A1612';return(<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'0 28px',fontWeight:600,fontSize:15,color:c,height:44}}><span>{time}</span><div style={{display:'flex',gap:6,alignItems:'center'}}><svg width="16" height="10" viewBox="0 0 16 10"><rect x="0" y="7" width="2.5" height="3" rx="0.5" fill={c}/><rect x="4" y="5" width="2.5" height="5" rx="0.5" fill={c}/><rect x="8" y="3" width="2.5" height="7" rx="0.5" fill={c}/><rect x="12" y="1" width="2.5" height="9" rx="0.5" fill={c}/></svg>{SF.wifi(c)}<svg width="24" height="12" viewBox="0 0 24 12"><rect x="0.5" y="0.5" width="20" height="11" rx="3" fill="none" stroke={c} strokeOpacity="0.45"/><rect x="2" y="2" width="11" height="8" rx="1.5" fill={c}/><rect x="21" y="4" width="2" height="4" rx="1" fill={c} opacity="0.45"/></svg></div></div>);}

/* ============ 1) Import Entry ============ */
function ImportEntry({dark=false}){
  const c=u(dark);
  return(<div style={{flex:1,background:c.bg,display:'flex',flexDirection:'column'}}>

      <div style={{fontSize:13,fontWeight:600,color:c.ink700}}>Import recipe</div>
      <div style={{width:36}}/>
    </div>

    <div style={{flex:1,padding:'18px 20px 0',display:'flex',flexDirection:'column',gap:18}}>
      <div>
        <div style={{fontFamily:'var(--font-serif)',fontWeight:600,fontSize:28,lineHeight:'34px',letterSpacing:'-0.02em',color:c.ink900}}>Bring anything in.</div>
        <div style={{fontSize:14,color:c.ink500,marginTop:6,lineHeight:'20px'}}>Stir parses the recipe and adapts it to your kitchen.</div>
      </div>

      {/* URL field */}
      <div style={{background:c.paper100,border:`1.5px solid ${c.ember}`,borderRadius:14,padding:'14px 16px'}}>

        <div style={{display:'flex',alignItems:'center',gap:10}}>
          {SF.link(c.ink500,16)}
          <div style={{flex:1,fontSize:15,color:c.ink900,fontFamily:'var(--font-mono)'}}>nytimes.com/recipes/salmon-mis...</div>
        </div>
        <div style={{fontSize:12,color:c.sage,marginTop:8,display:'flex',alignItems:'center',gap:4}}>{SF.check(c.sage,12)} Recognized: NYT Cooking</div>
      </div>

      {/* Other sources */}
      <div>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:'0.12em',textTransform:'uppercase',color:c.ink500,marginBottom:8}}>Or</div>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {[
            {i:SF.photo(c.ember,18),t:'Photo from Library',s:'JPG, HEIC. Multi-page cookbook OK.'},
            {i:SF.camera(c.ember,18),t:'Camera',s:'Shoot a page or a handwritten card.'},
            {i:SF.text(c.ember,18),t:'Paste text',s:'From a screenshot, email, or anywhere.'},
          ].map(r=><button key={r.t} style={{textAlign:'left',padding:'14px 16px',background:c.paper100,border:`1px solid ${c.ink100}`,borderRadius:14,display:'flex',gap:12,alignItems:'center',cursor:'pointer'}}>
            <div style={{width:40,height:40,borderRadius:10,background:c.emberTint,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{r.i}</div>
            <div style={{flex:1}}>
              <div style={{fontSize:15,fontWeight:600,color:c.ink900}}>{r.t}</div>
              <div style={{fontSize:12,color:c.ink500,marginTop:1}}>{r.s}</div>
            </div>
            {SF.chev(c.ink500,14)}
          </button>)}
        </div>
      </div>

      <div style={{background:c.paper100,borderRadius:10,padding:'10px 12px',fontSize:12,color:c.ink500,lineHeight:'16px'}}>
        Anything you import stays private to your account. We don't train on your cookbook.

}

        <div style={{display:'flex',justifyContent:'space-between',marginBottom:6,fontSize:12}}>
          <span style={{color:c.ink500,fontWeight:600}}>Parsing</span>
          <span style={{color:c.ember,fontFamily:'var(--font-mono)',fontWeight:600}}>62%</span>
        </div>
        <div style={{height:6,background:c.ink100,borderRadius:3,overflow:'hidden'}}>
          <div style={{height:'100%',width:'62%',background:c.ember,borderRadius:3}}/>
        </div>
        <div style={{marginTop:12,display:'flex',flexDirection:'column',gap:6,fontSize:12}}>
          {[
            {t:'Scan pages',done:true},
            {t:'Stitch & deskew',done:true},
            {t:'Read ingredients',done:false,active:true},
            {t:'Adapt to your kitchen',done:false},
          ].map((s,i)=><div key={s.t} style={{display:'flex',alignItems:'center',gap:8}}>
            <div style={{width:16,height:16,borderRadius:999,background:s.done?c.sage:(s.active?c.ember:'transparent'),border:s.done||s.active?'none':`1.5px solid ${c.ink300}`,display:'flex',alignItems:'center',justifyContent:'center'}}>
              {s.done && SF.check('#fff',10)}
              {s.active && <div style={{width:6,height:6,borderRadius:999,background:'#fff',animation:'pulse 1s ease-in-out infinite'}}/>}
            </div>
            <div style={{color:s.done?c.ink500:c.ink700,fontWeight:s.active?600:400}}>{s.t}</div>
          </div>)}
        </div>
      </div>

      <div style={{fontSize:12,color:c.ink500,textAlign:'center',maxWidth:280,lineHeight:16}}>Pages are processed on-device. Original photos aren't sent anywhere.</div>
      <style>{`@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(0.6);opacity:0.6}}`}</style>
    </div>

    <div style={{padding:'14px 18px 18px'}}>
      <button style={{width:'100%',height:52,borderRadius:12,background:c.paper100,border:`1px solid ${c.ink100}`,fontSize:15,fontWeight:600,color:c.ink700}}>Leave it running</button>
    </div>
  </div>);
}
