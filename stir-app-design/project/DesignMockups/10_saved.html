<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stir — 10 Saved</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{--font-sans:-apple-system,"SF Pro Text",BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;--font-serif:"New York","NewYork",ui-serif,"Source Serif 4",Georgia,serif;--font-mono:ui-monospace,"SF Mono",Menlo,monospace}
  html,body{margin:0;padding:0}body{background:#EFEAE1;font-family:var(--font-sans);color:#1A1612;-webkit-font-smoothing:antialiased}
  .mock-page{min-height:100vh;padding:48px 32px 80px}.mock-header{max-width:1600px;margin:0 auto 40px}
  .mock-title{font-family:var(--font-serif);font-weight:600;font-size:40px;letter-spacing:-0.02em;line-height:1.1;margin:0}
  .mock-sub{font-size:15px;color:#6B5F54;margin:8px 0 0;max-width:780px;line-height:1.55}.mock-sub em{color:#3D342C;font-style:italic}
  .mock-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;font-size:11px;color:#6B5F54;letter-spacing:0.06em;text-transform:uppercase}
  .mock-meta span{padding:4px 10px;background:#E8E3DD;border-radius:999px}.mock-main{max-width:1600px;margin:0 auto}
  .mock-section{margin-top:56px;padding-top:24px;border-top:1px solid #D9D2C4}.mock-section:first-of-type{border-top:none;padding-top:0;margin-top:24px}
  .mock-section-title{font-family:var(--font-serif);font-weight:600;font-size:24px;letter-spacing:-0.01em;margin:0}
  .mock-section-desc{font-size:14px;color:#6B5F54;margin:6px 0 0;max-width:760px;line-height:1.55}
  .mock-row{display:flex;flex-wrap:wrap;gap:36px;margin-top:24px;align-items:flex-start;justify-content:center}
  .mock-cell{display:flex;flex-direction:column;gap:10px}.mock-cell-label{font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#6B5F54}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const L={bg:'#FAF7F2',paper100:'#F3EEE5',paper200:'#EBE3D6',ink900:'#1A1612',ink700:'#3D342C',ink500:'#6B5F54',ink300:'#A89E93',ink100:'#E8E3DD',ember:'#C8532B',emberTint:'#FBEAE0',sage:'#4A7C59',sageTint:'#E4EEE6',amber:'#B8860B',amberTint:'#F5ECD5',voice:'#5E4AE0',voiceTint:'#E8E3FA'};
const D={bg:'#14100B',paper100:'#1F1A14',paper200:'#2A241C',ink900:'#F5F0E8',ink700:'#D6CEC3',ink500:'#9A8F84',ink300:'#5E5349',ink100:'#2E2822',ember:'#E26340',emberTint:'#3A1E13',sage:'#6FA07C',sageTint:'#1E2E23',amber:'#D4A21F',amberTint:'#2E2614',voice:'#8473E8',voiceTint:'#1F1A33'};
const u=(d)=>d?D:L;
const SF={
  close:(c,s=18)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2.2" strokeLinecap="round"><path d="M6 6l12 12M6 18L18 6"/></svg>,
  wifi:(c,s=14)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.7" strokeLinecap="round"><path d="M2 9c6-6 14-6 20 0M5 13c4.5-4.5 10-4.5 14.5 0M8.5 16.5c2.5-2.5 5-2.5 7.5 0"/><circle cx="12" cy="20" r="1" fill={c}/></svg>,
  search:(c,s=16)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>,
  filter:(c,s=16)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>,
  heart:(c,s=14,fill=false)=><svg width={s} height={s} viewBox="0 0 24 24" fill={fill?c:'none'} stroke={c} strokeWidth="1.8"><path d="M12 21s-8-5.5-8-11a5 5 0 019-3 5 5 0 019 3c0 5.5-8 11-8 11z"/></svg>,
  lock:(c,s=16)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>,
  chev:(c,s=14)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 6l6 6-6 6"/></svg>,
  back:(c,s=18)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 6l-6 6 6 6"/></svg>,
  play:(c,s=14)=><svg width={s} height={s} viewBox="0 0 24 24" fill={c}><path d="M7 4l14 8-14 8z"/></svg>,
  clock:(c,s=13)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.7" strokeLinecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>,
  sparkle:(c,s=12)=><svg width={s} height={s} viewBox="0 0 24 24" fill={c}><path d="M12 2l1.8 4.2L18 8l-4.2 1.8L12 14l-1.8-4.2L6 8l4.2-1.8z"/></svg>,
  star:(c,s=12,fill=true)=><svg width={s} height={s} viewBox="0 0 24 24" fill={fill?c:'none'} stroke={c} strokeWidth="1.6"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.5l7.1-.6z"/></svg>,
};
function Bar({dark,time='7:06'}){const c=dark?'#F5F0E8':'#1A1612';return(<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'0 28px',fontWeight:600,fontSize:15,color:c,height:44}}><span>{time}</span><div style={{display:'flex',gap:6,alignItems:'center'}}><svg width="16" height="10" viewBox="0 0 16 10"><rect x="0" y="7" width="2.5" height="3" rx="0.5" fill={c}/><rect x="4" y="5" width="2.5" height="5" rx="0.5" fill={c}/><rect x="8" y="3" width="2.5" height="7" rx="0.5" fill={c}/><rect x="12" y="1" width="2.5" height="9" rx="0.5" fill={c}/></svg>{SF.wifi(c)}<svg width="24" height="12" viewBox="0 0 24 12"><rect x="0.5" y="0.5" width="20" height="11" rx="3" fill="none" stroke={c} strokeOpacity="0.45"/><rect x="2" y="2" width="11" height="8" rx="1.5" fill={c}/><rect x="21" y="4" width="2" height="4" rx="1" fill={c} opacity="0.45"/></svg></div></div>);}
function Frame({children,dark=false,time='7:06'}){const c=u(dark);return(<div style={{width:402,height:856,padding:6,background:dark?'#0a0805':'#f7f3ec',borderRadius:54,boxShadow:`0 30px 60px rgba(26,22,18,0.18)`,boxSizing:'border-box'}}><div style={{width:390,height:844,borderRadius:48,background:c.bg,overflow:'hidden',position:'relative',fontFamily:'var(--font-sans)',color:c.ink900}}><div style={{position:'absolute',top:10,left:'50%',transform:'translateX(-50%)',width:120,height:34,borderRadius:20,background:'#000',zIndex:100}}/><Bar dark={dark} time={time}/><div style={{height:808,overflow:'hidden',display:'flex',flexDirection:'column'}}>{children}</div><div style={{position:'absolute',bottom:8,left:'50%',transform:'translateX(-50%)',width:134,height:5,borderRadius:999,background:dark?'#F5F0E8':'#1A1612',opacity:0.4,zIndex:101}}/></div></div>);}

const RECIPES=[
  {t:'Miso-Glazed Salmon',time:28,cooked:3,rating:5,tag:'Weeknight',emoji:'🐟',color:'#C8532B22'},
  {t:'Crispy Kale Caesar',time:18,cooked:2,rating:4,tag:'Quick',emoji:'🥗',color:'#4A7C5922'},
  {t:'Sheet-pan gnocchi',time:35,cooked:1,rating:4,tag:'One-pan',emoji:'🍝',color:'#B8860B22'},
  {t:'Chickpea coconut curry',time:32,cooked:2,rating:5,tag:'Batch',emoji:'🥘',color:'#C8532B22'},
  {t:'Lemon butter chicken',time:40,cooked:4,rating:5,tag:'Family',emoji:'🍗',color:'#B8860B22'},
];

/* ============ 1) Saved Library ============ */
function Library({dark=false}){
  const c=u(dark);
  return(<div style={{flex:1,background:c.bg,display:'flex',flexDirection:'column'}}>
    <div style={{padding:'8px 20px 6px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
      <div style={{fontFamily:'var(--font-serif)',fontWeight:600,fontSize:28,letterSpacing:'-0.01em'}}>Saved</div>
      <div style={{display:'flex',gap:8}}>
        <button style={{width:36,height:36,borderRadius:999,background:c.paper200,border:0,display:'flex',alignItems:'center',justifyContent:'center'}}>{SF.search(c.ink700,16)}</button>
        <button style={{width:36,height:36,borderRadius:999,background:c.paper200,border:0,display:'flex',alignItems:'center',justifyContent:'center'}}>{SF.filter(c.ink700,16)}</button>
      </div>
    </div>
    <div style={{padding:'2px 20px 12px',fontSize:13,color:c.ink500}}>5 of 5 · Free tier limit</div>

    {/* Filter chips */}
    <div style={{padding:'0 20px 10px',display:'flex',gap:6,overflow:'hidden'}}>
      {['All','Cooked','Quick','Weeknight','Batch'].map((t,i)=>
        <div key={t} style={{padding:'6px 12px',background:i===0?c.ink900:c.paper100,color:i===0?c.bg:c.ink700,border:`1px solid ${i===0?c.ink900:c.ink100}`,borderRadius:999,fontSize:12,fontWeight:600,flexShrink:0}}>{t}</div>
      )}
    </div>

    <div style={{flex:1,padding:'0 20px 0',display:'flex',flexDirection:'column',gap:10,overflow:'hidden'}}>
      {RECIPES.slice(0,4).map((r,i)=><div key={r.t} style={{padding:'12px',background:c.paper100,border:`1px solid ${c.ink100}`,borderRadius:16,display:'flex',gap:12,alignItems:'center'}}>
        <div style={{width:68,height:68,borderRadius:12,background:r.color,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:30}}>{r.emoji}</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            <div style={{fontSize:10,fontWeight:700,letterSpacing:'0.12em',textTransform:'uppercase',color:c.ember}}>{r.tag}</div>
            {r.cooked>2 && <div style={{fontSize:10,color:c.sage,fontWeight:600,display:'flex',alignItems:'center',gap:2}}>{SF.sparkle(c.sage,10)} Favorite</div>}
          </div>
          <div style={{fontSize:15,fontWeight:600,color:c.ink900,marginTop:2,lineHeight:'18px'}}>{r.t}</div>
          <div style={{fontSize:12,color:c.ink500,marginTop:3,display:'flex',gap:10,alignItems:'center'}}>
            <span style={{display:'flex',alignItems:'center',gap:3}}>{SF.clock(c.ink500,11)} {r.time} min</span>
            <span>Cooked {r.cooked}×</span>
            <span style={{display:'flex',alignItems:'center',gap:2}}>{[...Array(r.rating)].map((_,k)=><span key={k}>{SF.star(c.amber,10)}</span>)}</span>
          </div>
        </div>
        <div style={{padding:6}}>{SF.heart(c.ember,16,true)}</div>
      </div>)}
      <div style={{padding:'14px',background:c.voiceTint,border:`1.5px dashed ${c.voice}`,borderRadius:16,display:'flex',gap:12,alignItems:'center'}}>
        <div style={{width:44,height:44,borderRadius:999,background:c.voice,display:'flex',alignItems:'center',justifyContent:'center'}}>{SF.lock('#fff',18)}</div>
        <div style={{flex:1}}>
          <div style={{fontSize:14,fontWeight:600,color:c.ink900}}>Save unlimited recipes</div>
          <div style={{fontSize:12,color:c.ink700,marginTop:2,lineHeight:'16px'}}>Free tier holds 5. Premium lifts the cap and adds folders.</div>
        </div>
        {SF.chev(c.voice,14)}
      </div>
    </div>

    {/* tab bar */}
    <div style={{height:72,borderTop:`1px solid ${c.ink100}`,display:'flex',justifyContent:'space-around',alignItems:'flex-start',padding:'10px 0 0',background:c.bg}}>
      {[['Tonight',false],['Saved',true],['Grocery',false],['Settings',false]].map(([t,a])=><div key={t} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:3,opacity:a?1:0.5}}>
        <div style={{width:22,height:22,borderRadius:6,background:a?c.ember:'transparent',border:a?'none':`1.5px solid ${c.ink500}`}}/>
        <div style={{fontSize:10,fontWeight:a?700:500,color:a?c.ember:c.ink500}}>{t}</div>
      </div>)}
    </div>
  </div>);
}

/* ============ 2) Free-tier cap hit ============ */
function CapHit({dark=false}){
  const c=u(dark);
  return(<div style={{flex:1,background:c.bg,display:'flex',flexDirection:'column'}}>
    <div style={{padding:'8px 20px 6px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
      <button style={{width:36,height:36,borderRadius:999,background:c.paper200,border:0,display:'flex',alignItems:'center',justifyContent:'center'}}>{SF.back(c.ink700,16)}</button>
      <div style={{fontSize:13,fontWeight:600,color:c.ink700}}>Save recipe</div>
      <div style={{width:36}}/>
    </div>

    <div style={{flex:1,padding:'30px 24px 0',display:'flex',flexDirection:'column',alignItems:'center',gap:18}}>
      <div style={{width:88,height:88,borderRadius:999,background:c.amberTint,display:'flex',alignItems:'center',justifyContent:'center',border:`1px solid ${c.amber}33`}}>
        {SF.lock(c.amber,36)}
      </div>
      <div style={{textAlign:'center'}}>
        <div style={{fontFamily:'var(--font-serif)',fontWeight:600,fontSize:28,letterSpacing:'-0.02em',color:c.ink900,lineHeight:'34px'}}>Your Saved is full.</div>
        <div style={{fontSize:15,color:c.ink500,marginTop:8,lineHeight:'22px',maxWidth:300}}>Free keeps 5. Premium has no cap — plus folders and cook history.</div>
      </div>

      <div style={{alignSelf:'stretch',background:c.paper100,border:`1px solid ${c.ink100}`,borderRadius:14,padding:'14px 16px'}}>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:'0.12em',textTransform:'uppercase',color:c.ink500,marginBottom:8}}>Make room</div>
        {[
          {t:'Sheet-pan gnocchi',sub:'Cooked 1× · 4 months ago',rm:true},
          {t:'Chickpea coconut curry',sub:'Cooked 2× · 6 weeks ago'},
        ].map((r,i)=><div key={r.t} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 0',borderTop:i===0?'none':`1px solid ${c.ink100}`}}>
          <div style={{width:38,height:38,borderRadius:8,background:c.paper200,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,flexShrink:0}}>{i===0?'🍝':'🥘'}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:14,fontWeight:600,color:c.ink900}}>{r.t}</div>
            <div style={{fontSize:12,color:c.ink500,marginTop:1}}>{r.sub}</div>
          </div>
          <button style={{padding:'6px 12px',background:'transparent',border:`1px solid ${c.ink100}`,borderRadius:999,fontSize:12,fontWeight:600,color:c.ink700}}>Remove</button>
        </div>)}
      </div>
    </div>

    <div style={{padding:'14px 18px 30px',display:'flex',gap:10}}>
      <button style={{flex:1,height:52,borderRadius:12,background:c.paper100,border:`1px solid ${c.ink100}`,fontSize:15,fontWeight:600,color:c.ink700}}>Not now</button>
      <button style={{flex:2,height:52,borderRadius:12,border:0,background:c.voice,color:'#fff',fontSize:17,fontWeight:600,display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
        {SF.star('#fff',14)} Go Premium
      </button>
    </div>
  </div>);
}

/* ============ 3) Recipe Detail / Replay ============ */
function RecipeDetail({dark=false}){
  const c=u(dark);
  return(<div style={{flex:1,background:c.bg,display:'flex',flexDirection:'column'}}>
    {/* hero */}
    <div style={{height:240,background:'#C8532B22',position:'relative',display:'flex',alignItems:'flex-end'}}>
      <div style={{position:'absolute',top:10,left:16,right:16,display:'flex',justifyContent:'space-between'}}>
        <button style={{width:36,height:36,borderRadius:999,background:'rgba(255,255,255,0.9)',border:0,display:'flex',alignItems:'center',justifyContent:'center'}}>{SF.back('#1A1612',16)}</button>
        <button style={{width:36,height:36,borderRadius:999,background:'rgba(255,255,255,0.9)',border:0,display:'flex',alignItems:'center',justifyContent:'center'}}>{SF.heart(c.ember,16,true)}</button>
      </div>
      <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:100,opacity:0.95}}>🐟</div>
      <div style={{position:'relative',padding:'0 20px 14px'}}>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:'0.14em',textTransform:'uppercase',color:'#fff',background:'#1A1612cc',display:'inline-block',padding:'4px 10px',borderRadius:999}}>Weeknight · Cooked 3×</div>
      </div>
    </div>

    <div style={{flex:1,padding:'18px 20px 0',display:'flex',flexDirection:'column',gap:14,overflow:'hidden'}}>
      <div>
        <div style={{fontFamily:'var(--font-serif)',fontWeight:600,fontSize:26,letterSpacing:'-0.01em',color:c.ink900,lineHeight:'32px'}}>Miso-Glazed Salmon</div>
        <div style={{fontSize:13,color:c.ink500,marginTop:4,display:'flex',gap:10}}>
          <span>28 min · 2 servings</span>
          <span>·</span>
          <span style={{display:'flex',alignItems:'center',gap:3}}>{[...Array(5)].map((_,k)=><span key={k}>{SF.star(c.amber,10)}</span>)}</span>
        </div>
      </div>

      {/* cook history */}
      <div style={{background:c.paper100,border:`1px solid ${c.ink100}`,borderRadius:14,padding:'12px 14px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:'0.12em',textTransform:'uppercase',color:c.ink500}}>Cook history</div>
          <div style={{fontSize:12,color:c.ink500}}>3 cooks</div>
        </div>
        {[
          {d:'Last Tuesday',note:'Halved the glaze. Perfect.',r:5},
          {d:'Mar 14',note:'Kids asked for seconds.',r:5},
          {d:'Feb 28',note:'Too sweet. Cut sugar next time.',r:4},
        ].map((h,i)=><div key={i} style={{display:'flex',gap:10,padding:'8px 0',borderTop:i===0?'none':`1px solid ${c.ink100}`,alignItems:'flex-start'}}>
          <div style={{width:6,height:6,borderRadius:999,background:c.ember,marginTop:7,flexShrink:0}}/>
          <div style={{flex:1}}>
            <div style={{fontSize:13,fontWeight:600,color:c.ink900,display:'flex',gap:6,alignItems:'center'}}>{h.d} <span style={{display:'flex',gap:1}}>{[...Array(h.r)].map((_,k)=><span key={k}>{SF.star(c.amber,9)}</span>)}</span></div>
            <div style={{fontSize:13,color:c.ink700,marginTop:1,fontStyle:'italic'}}>"{h.note}"</div>
          </div>
        </div>)}
      </div>

      {/* scaled ingredients */}
      <div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:'0.12em',textTransform:'uppercase',color:c.ink500}}>Ingredients · for 2</div>
          <div style={{display:'flex',gap:4}}>
            <button style={{width:26,height:26,borderRadius:6,background:c.paper200,border:0,fontSize:13,fontWeight:600,color:c.ink700}}>−</button>
            <button style={{width:26,height:26,borderRadius:6,background:c.ember,border:0,color:'#fff',fontSize:13,fontWeight:600}}>+</button>
          </div>
        </div>
        <div style={{fontSize:13,color:c.ink700,lineHeight:'22px'}}>
          2 salmon fillets · 2 tbsp white miso · 2 tbsp mirin · 1 tbsp sake · 1 tsp sugar · cooked rice · asparagus
        </div>
      </div>
    </div>

    <div style={{padding:'14px 18px 30px',display:'flex',gap:10,borderTop:`1px solid ${c.ink100}`}}>
      <button style={{flex:1,height:52,borderRadius:12,background:c.paper100,border:`1px solid ${c.ink100}`,fontSize:15,fontWeight:600,color:c.ink700}}>Grocery list</button>
      <button style={{flex:2,height:52,borderRadius:12,border:0,background:c.ember,color:'#fff',fontSize:17,fontWeight:600,display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
        {SF.play('#fff',14)} Replay cook
      </button>
    </div>
  </div>);
}

function Page(){
  return(<div className="mock-page">
    <header className="mock-header">
      <h1 className="mock-title">10 · Saved</h1>
      <p className="mock-sub">
        Saved is <em>a cook's notebook</em>, not a clip file. Free tier caps at
        5 — deliberate constraint, not a nag. The detail view is built around
        cook history: same recipe, different nights, what you changed. That's
        what makes a recipe <em>yours</em>.
      </p>
      <div className="mock-meta">
        <span>Catalog #30–#32</span>
        <span>iPhone 16 Pro · 390×844</span>
        <span>Free: 5 saves · Premium: unlimited + folders</span>
        <span>Specs §12 — Saved Library</span>
      </div>
    </header>
    <main className="mock-main">
      <section className="mock-section">
        <h2 className="mock-section-title">Saved Library</h2>
        <p className="mock-section-desc">
          List view with tag + filter chips. Each row surfaces cook count and
          rating — the signal, not just the title. The 5-of-5 tier note at top
          is matter-of-fact; the Premium prompt at the bottom of the list is
          calm, voice-violet, and never blocks a save.
        </p>
        <div className="mock-row">

      <section className="mock-section">
