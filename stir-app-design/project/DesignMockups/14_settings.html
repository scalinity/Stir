    <div style={{flex:1,overflow:'auto',padding:'0 20px 20px'}}>

        <div style={{fontSize:13,color:c.ink500,marginTop:6,lineHeight:'18px'}}>Stir scales recipes to this household size and merges everyone's preferences.</div>
      </div>

      {/* Size */}
      <div style={{fontSize:10,fontWeight:700,letterSpacing:'0.14em',textTransform:'uppercase',color:c.ink500,marginBottom:8}}>Default servings</div>
      <div style={{padding:'16px 18px',background:c.paper100,borderRadius:14,border:`1px solid ${c.ink100}`,display:'flex',alignItems:'center',gap:12,marginBottom:20}}>
        <button style={{width:36,height:36,borderRadius:999,background:c.ink900,border:0,display:'flex',alignItems:'center',justifyContent:'center',color:c.bg,fontSize:18,fontWeight:600}}>−</button>
        <div style={{flex:1,textAlign:'center'}}>
          <div style={{fontFamily:'var(--font-serif)',fontSize:38,fontWeight:600,letterSpacing:'-0.02em',color:c.ink900,lineHeight:1}}>2</div>
          <div style={{fontSize:11,color:c.ink500,marginTop:4,letterSpacing:'0.06em',textTransform:'uppercase'}}>servings</div>
        </div>
        <button style={{width:36,height:36,borderRadius:999,background:c.ember,border:0,display:'flex',alignItems:'center',justifyContent:'center'}}>{SF.plus('#fff',14)}</button>
      </div>

      {/* Members */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
        <div style={{fontSize:10,fontWeight:700,letterSpacing:'0.14em',textTransform:'uppercase',color:c.ink500}}>Members</div>
        <button style={{background:'transparent',border:0,color:c.ember,fontSize:12,fontWeight:600,padding:'4px 0',display:'flex',alignItems:'center',gap:3}}>{SF.plus(c.ember,12)} Invite</button>
      </div>
      <div style={{background:c.paper100,borderRadius:14,border:`1px solid ${c.ink100}`,overflow:'hidden',marginBottom:20}}>
        {[
          {n:'Maya Chen',sub:'You · owner',pref:'Shellfish, pork avoid',initial:'M',bg:`linear-gradient(135deg, ${c.ember}, ${c.amber})`},
          {n:'Jordan Park',sub:'Joined Mar 14',pref:'Cilantro dislike',initial:'J',bg:`linear-gradient(135deg, ${c.sage}, ${c.amber})`},
        ].map((m,i)=><div key={m.n} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px',borderTop:i===0?'none':`1px solid ${c.ink100}`}}>
          <div style={{width:40,height:40,borderRadius:999,background:m.bg,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontFamily:'var(--font-serif)',fontSize:16,fontWeight:600,flexShrink:0}}>{m.initial}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:14,fontWeight:600,color:c.ink900}}>{m.n}</div>
            <div style={{fontSize:11,color:c.ink500}}>{m.sub} · {m.pref}</div>
          </div>
          {SF.chev(c.ink500,13)}
        </div>)}
      </div>

      {/* Shopping */}
      <div style={{fontSize:10,fontWeight:700,letterSpacing:'0.14em',textTransform:'uppercase',color:c.ink500,marginBottom:8}}>Shopping</div>
      <div style={{background:c.paper100,borderRadius:14,border:`1px solid ${c.ink100}`,overflow:'hidden'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 14px'}}>
          <div style={{flex:1,fontSize:14,fontWeight:500,color:c.ink900}}>Home store</div>
          <div style={{fontSize:13,color:c.ink500}}>Whole Foods · Gowanus</div>
          {SF.chev(c.ink500,12)}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 14px',borderTop:`1px solid ${c.ink100}`}}>
          <div style={{flex:1}}>
            <div style={{fontSize:14,fontWeight:500,color:c.ink900}}>Shared grocery list</div>
            <div style={{fontSize:12,color:c.ink500,marginTop:1}}>Both members can add and check off</div>
          </div>
          <Toggle on={true} dark={dark}/>
        </div>
      </div>
    </div>
  </div>);
}
