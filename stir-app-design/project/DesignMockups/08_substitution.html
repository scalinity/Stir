<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stir — 08 Substitution</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{--font-sans:-apple-system,"SF Pro Text",BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;--font-serif:"New York","NewYork",ui-serif,"Source Serif 4",Georgia,serif;--font-mono:ui-monospace,"SF Mono",Menlo,monospace}
  html,body{margin:0;padding:0}body{background:#EFEAE1;font-family:var(--font-sans);color:#1A1612;-webkit-font-smoothing:antialiased}
  .mock-page{min-height:100vh;padding:48px 32px 80px}.mock-header{max-width:1600px;margin:0 auto 40px}
  .mock-title{font-family:var(--font-serif);font-weight:600;font-size:40px;letter-spacing:-0.02em;line-height:1.1;margin:0}
  .mock-sub{font-size:15px;color:#6B5F54;margin:8px 0 0;max-width:780px;line-height:1.55}.mock-sub em{color:#3D342C;font-style:italic}
  .mock-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;font-size:11px;color:#6B5F54;letter-spacing:0.06em;text-transform:uppercase}
  .mock-meta span{padding:4px 10px;background:#E8E3DD;border-radius:999px}.mock-main{max-width:1600px;margin:0 auto}
  .mock-section{margin-top:56px;padding-top:24px;border-top:1px solid #D9D2C4}.mock-section:first-of-type{border-top:none;padding-top:0;margin-top:24px}
  .mock-section-title{font-family:var(--font-serif);font-weight:600;font-size:24px;letter-spacing:-0.01em;margin:0}
  .mock-section-desc{font-size:14px;color:#6B5F54;margin:6px 0 0;max-width:760px;line-height:1.55}
  .mock-row{display:flex;flex-wrap:wrap;gap:36px;margin-top:24px;align-items:flex-start;justify-content:center}
  .mock-cell{display:flex;flex-direction:column;gap:10px}.mock-cell-label{font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#6B5F54}
  .mock-cell-caption{font-size:12px;line-height:1.5;color:#6B5F54;max-width:410px;margin-top:2px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const L={bg:'#FAF7F2',paper100:'#F3EEE5',paper200:'#EBE3D6',ink900:'#1A1612',ink700:'#3D342C',ink500:'#6B5F54',ink300:'#A89E93',ink100:'#E8E3DD',ember:'#C8532B',emberTint:'#FBEAE0',sage:'#4A7C59',sageTint:'#E4EEE6',amber:'#B8860B',amberTint:'#F5ECD5',crimson:'#9A2E2E',crimsonTint:'#F2DCDC',voice:'#5E4AE0',voiceTint:'#E8E3FA'};
const D={bg:'#14100B',paper100:'#1F1A14',paper200:'#2A241C',ink900:'#F5F0E8',ink700:'#D6CEC3',ink500:'#9A8F84',ink300:'#5E5349',ink100:'#2E2822',ember:'#E26340',emberTint:'#3A1E13',sage:'#6FA07C',sageTint:'#1E2E23',amber:'#D4A21F',amberTint:'#2E2614',crimson:'#C94747',crimsonTint:'#2E1818',voice:'#8473E8',voiceTint:'#1F1A33'};
const u=(d)=>d?D:L;
const SF={
  close:(c,s=18)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2.2" strokeLinecap="round"><path d="M6 6l12 12M6 18L18 6"/></svg>,
  chev:(c,s=14)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 6l6 6-6 6"/></svg>,
  wifi:(c,s=14)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.7" strokeLinecap="round"><path d="M2 9c6-6 14-6 20 0M5 13c4.5-4.5 10-4.5 14.5 0M8.5 16.5c2.5-2.5 5-2.5 7.5 0"/><circle cx="12" cy="20" r="1" fill={c}/></svg>,
  warn:(c,s=16)=><svg width={s} height={s} viewBox="0 0 24 24" fill={c}><path d="M12 2L1 21h22L12 2z"/></svg>,
  shield:(c,s=16)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5l8-3z"/></svg>,
  check:(c,s=14)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2.4" strokeLinecap="round"><path d="M5 12l4 4 10-10"/></svg>,
  info:(c,s=14)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v0M12 11v5"/></svg>,
  mic:(c,s=14)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3M8 21h8"/></svg>,
  swap:(c,s=16)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M7 4l-3 3 3 3M4 7h12M17 14l3 3-3 3M20 17H8"/></svg>,
  x:(c,s=16)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2.4" strokeLinecap="round"><path d="M6 6l12 12M6 18L18 6"/></svg>,
};
function Bar({dark,time='7:51'}){const c=dark?'#F5F0E8':'#1A1612';return(<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'0 28px',fontWeight:600,fontSize:15,color:c,height:44}}><span>{time}</span><div style={{display:'flex',gap:6,alignItems:'center'}}><svg width="16" height="10" viewBox="0 0 16 10"><rect x="0" y="7" width="2.5" height="3" rx="0.5" fill={c}/><rect x="4" y="5" width="2.5" height="5" rx="0.5" fill={c}/><rect x="8" y="3" width="2.5" height="7" rx="0.5" fill={c}/><rect x="12" y="1" width="2.5" height="9" rx="0.5" fill={c}/></svg>{SF.wifi(c)}<svg width="24" height="12" viewBox="0 0 24 12"><rect x="0.5" y="0.5" width="20" height="11" rx="3" fill="none" stroke={c} strokeOpacity="0.45"/><rect x="2" y="2" width="11" height="8" rx="1.5" fill={c}/><rect x="21" y="4" width="2" height="4" rx="1" fill={c} opacity="0.45"/></svg></div></div>);}
function Frame({children,dark=false,time='7:51'}){const c=u(dark);return(<div style={{width:402,height:856,padding:6,background:dark?'#0a0805':'#f7f3ec',borderRadius:54,boxShadow:`0 30px 60px rgba(26,22,18,0.18)`,boxSizing:'border-box'}}><div style={{width:390,height:844,borderRadius:48,background:c.bg,overflow:'hidden',position:'relative',fontFamily:'var(--font-sans)',color:c.ink900}}><div style={{position:'absolute',top:10,left:'50%',transform:'translateX(-50%)',width:120,height:34,borderRadius:20,background:'#000',zIndex:100}}/><Bar dark={dark} time={time}/><div style={{height:808,overflow:'hidden',display:'flex',flexDirection:'column'}}>{children}</div><div style={{position:'absolute',bottom:8,left:'50%',transform:'translateX(-50%)',width:134,height:5,borderRadius:999,background:dark?'#F5F0E8':'#1A1612',opacity:0.4,zIndex:101}}/></div></div>);}

/* Backdrop (dimmed step behind sheet) */
function Backdrop({c}){return(<div style={{position:'absolute',inset:0,background:c.bg,padding:'0 20px',display:'flex',flexDirection:'column'}}>
  <div style={{fontSize:13,color:c.ink500,marginTop:12}}>Step 4 of 5</div>
  <div style={{fontFamily:'var(--font-serif)',fontWeight:600,fontSize:30,lineHeight:'36px',color:c.ink900,marginTop:8}}>Whisk the glaze.</div>
  <div style={{fontSize:15,color:c.ink700,marginTop:8}}>Miso, mirin, sake, sugar. Smooth, no lumps.</div>
  <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.42)'}}/>
</div>);}

/* ============ 1) Substitution Sheet (Premium voice-augmented) ============ */
function SubSheet({dark=false}){
  const c=u(dark);
  return(<div style={{flex:1,background:c.bg,position:'relative',overflow:'hidden'}}>
    <Backdrop c={c}/>
    <div style={{position:'absolute',left:0,right:0,bottom:0,background:c.bg,borderRadius:'24px 24px 0 0',padding:'10px 20px 22px',boxShadow:'0 -8px 24px rgba(0,0,0,0.12)'}}>
      <div style={{width:40,height:4,borderRadius:999,background:c.ink100,margin:'0 auto 14px'}}/>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
        <div>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:'0.14em',textTransform:'uppercase',color:c.ember}}>Out of mirin?</div>
          <div style={{fontFamily:'var(--font-serif)',fontWeight:600,fontSize:22,letterSpacing:'-0.01em',color:c.ink900,marginTop:4}}>Here's what I'd swap in.</div>
        </div>
        <button style={{width:32,height:32,borderRadius:999,background:c.paper200,border:0,display:'flex',alignItems:'center',justifyContent:'center'}}>{SF.close(c.ink700,14)}</button>
      </div>

      {/* Voice hint chip (Premium-only) */}
      <div style={{background:c.voiceTint,border:`1px solid ${c.voice}`,borderRadius:10,padding:'8px 12px',display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
        {SF.mic(c.voice,14)}
        <div style={{flex:1,fontSize:12,color:c.ink700,lineHeight:'16px'}}>Say <b style={{color:c.voice}}>"use rice vinegar"</b> or <b style={{color:c.voice}}>"skip it"</b>.</div>
      </div>

      {/* Options */}
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        <div style={{border:`1.5px solid ${c.ember}`,background:c.emberTint,borderRadius:14,padding:'14px 16px'}}>
          <div style={{fontSize:10,fontWeight:700,letterSpacing:'0.14em',textTransform:'uppercase',color:c.ember,marginBottom:4}}>Recommended</div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
            <div>
              <div style={{fontSize:16,fontWeight:600,color:c.ink900}}>Rice vinegar + ½ tsp sugar</div>
              <div style={{fontSize:13,color:c.ink700,marginTop:3,display:'flex',alignItems:'center',gap:6}}>
                <span style={{width:6,height:6,borderRadius:999,background:c.sage}}/> Closest match. In your pantry.
              </div>
            </div>
            {SF.chev(c.ember,16)}
          </div>
        </div>
        <button style={{textAlign:'left',border:`1px solid ${c.ink100}`,background:c.paper100,borderRadius:14,padding:'12px 16px',display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,cursor:'pointer'}}>
          <div>
            <div style={{fontSize:15,fontWeight:600,color:c.ink900}}>Dry white wine + ½ tsp sugar</div>
            <div style={{fontSize:13,color:c.ink700,marginTop:2,display:'flex',alignItems:'center',gap:6}}>
              <span style={{width:6,height:6,borderRadius:999,background:c.amber}}/> Works. Not in your kitchen.
            </div>
          </div>
          {SF.chev(c.ink500,16)}
        </button>
        <button style={{textAlign:'left',border:`1px solid ${c.ink100}`,background:c.paper100,borderRadius:14,padding:'12px 16px',display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,cursor:'pointer'}}>
          <div>
            <div style={{fontSize:15,fontWeight:600,color:c.ink900}}>Skip it</div>
            <div style={{fontSize:13,color:c.ink700,marginTop:2,display:'flex',alignItems:'center',gap:6}}>
              <span style={{width:6,height:6,borderRadius:999,background:c.ink300}}/> Glaze will be less glossy but still good.
            </div>
          </div>
          {SF.chev(c.ink500,16)}
        </button>
      </div>

      <div style={{marginTop:12,background:c.paper100,borderRadius:10,padding:'10px 12px',display:'flex',gap:8,alignItems:'flex-start'}}>
        {SF.info(c.ink500,13)}
        <div style={{fontSize:12,color:c.ink500,lineHeight:'16px'}}>Based on allergens, stock, and what works in a miso glaze. Not medical advice.</div>
      </div>
    </div>
  </div>);
}

/* ============ 2) Result — Safe swap applied ============ */
function ResultSafe({dark=false}){
  const c=u(dark);
  return(<div style={{flex:1,background:c.bg,display:'flex',flexDirection:'column'}}>
    <div style={{padding:'8px 16px 10px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
      <button style={{width:36,height:36,borderRadius:999,background:c.paper200,border:0,display:'flex',alignItems:'center',justifyContent:'center'}}>{SF.close(c.ink700,16)}</button>
      <div style={{fontSize:13,fontWeight:600,color:c.ink700}}>Swap applied</div>
      <div style={{width:36}}/>
    </div>

    <div style={{flex:1,padding:'20px 20px 0',display:'flex',flexDirection:'column',gap:14}}>
      <div style={{background:c.sageTint,borderRadius:20,border:`1px solid ${c.sage}`,padding:'20px 20px'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
          <div style={{width:36,height:36,borderRadius:999,background:c.sage,display:'flex',alignItems:'center',justifyContent:'center'}}>{SF.check('#fff',18)}</div>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:'0.14em',textTransform:'uppercase',color:c.sage}}>Safe · Allergy-clear</div>
        </div>
        <div style={{fontFamily:'var(--font-serif)',fontWeight:600,fontSize:26,letterSpacing:'-0.01em',color:c.ink900,lineHeight:'32px'}}>Using rice vinegar + ½ tsp sugar.</div>
        <div style={{fontSize:14,color:c.ink700,marginTop:8,lineHeight:'20px'}}>Closest flavor match for mirin. Your glaze will still caramelize and cling to the fish.</div>
      </div>

      {/* Receipt */}
      <div style={{background:c.paper100,borderRadius:16,border:`1px solid ${c.ink100}`,padding:'14px 16px'}}>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:'0.12em',textTransform:'uppercase',color:c.ink500,marginBottom:10}}>The swap</div>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <div style={{flex:1,padding:'10px 12px',background:c.bg,border:`1px solid ${c.ink100}`,borderRadius:10}}>
            <div style={{fontSize:10,color:c.ink500,textTransform:'uppercase',letterSpacing:'0.12em'}}>Was</div>
            <div style={{fontSize:14,fontWeight:600,color:c.ink900,marginTop:2,textDecoration:'line-through',textDecorationColor:c.ink300}}>2 tbsp mirin</div>
          </div>
          <div style={{width:32,height:32,borderRadius:999,background:c.paper200,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{SF.swap(c.ember,14)}</div>
          <div style={{flex:1,padding:'10px 12px',background:c.emberTint,border:`1px solid ${c.ember}`,borderRadius:10}}>
            <div style={{fontSize:10,color:c.ember,textTransform:'uppercase',letterSpacing:'0.12em'}}>Now</div>
            <div style={{fontSize:14,fontWeight:600,color:c.ink900,marginTop:2}}>2 tbsp rice vinegar + ½ tsp sugar</div>
          </div>
        </div>
      </div>

      <div style={{background:c.paper100,borderRadius:14,border:`1px solid ${c.ink100}`,padding:'12px 14px'}}>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:'0.12em',textTransform:'uppercase',color:c.ink500,marginBottom:8}}>What changes</div>
        {[
          {t:'Sweetness',d:'Slightly less — the sugar balances'},
          {t:'Gloss',d:'About the same'},
          {t:'Cook time',d:'Unchanged'},
        ].map(r=><div key={r.t} style={{display:'flex',gap:10,padding:'6px 0',borderTop:`1px solid ${c.ink100}`,alignItems:'baseline'}}>
          <div style={{fontSize:13,fontWeight:600,color:c.ink900,width:90}}>{r.t}</div>
          <div style={{fontSize:13,color:c.ink700,flex:1}}>{r.d}</div>
        </div>)}
      </div>

      <button style={{display:'flex',alignItems:'center',gap:8,alignSelf:'flex-start',padding:'8px 0',background:'transparent',border:0,color:c.ember,fontSize:13,fontWeight:600}}>
        <span style={{textDecoration:'underline'}}>Show alternatives (2)</span>
      </button>
    </div>

    <div style={{padding:'14px 18px 18px',borderTop:`1px solid ${c.ink100}`,display:'flex',gap:10}}>
      <button style={{flex:1,height:52,borderRadius:12,background:c.paper100,border:`1px solid ${c.ink100}`,fontSize:15,fontWeight:600,color:c.ink700}}>Undo swap</button>
      <button style={{flex:2,height:52,borderRadius:12,border:0,background:c.ember,color:'#fff',fontSize:17,fontWeight:600}}>Keep & continue</button>
    </div>
  </div>);
}

/* ============ 3) Result — Unsafe / allergen blocked ============ */
function ResultBlocked({dark=false}){
  const c=u(dark);
  return(<div style={{flex:1,background:c.bg,display:'flex',flexDirection:'column'}}>
    <div style={{padding:'8px 16px 10px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
      <button style={{width:36,height:36,borderRadius:999,background:c.paper200,border:0,display:'flex',alignItems:'center',justifyContent:'center'}}>{SF.close(c.ink700,16)}</button>
      <div style={{fontSize:13,fontWeight:600,color:c.ink700}}>Substitution</div>
      <div style={{width:36}}/>
    </div>

    <div style={{flex:1,padding:'20px 20px 0',display:'flex',flexDirection:'column',gap:14}}>
      <div style={{background:c.crimsonTint,borderRadius:20,border:`1.5px solid ${c.crimson}`,padding:'20px 20px'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
          <div style={{width:36,height:36,borderRadius:999,background:c.crimson,display:'flex',alignItems:'center',justifyContent:'center'}}>{SF.warn('#fff',16)}</div>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:'0.14em',textTransform:'uppercase',color:c.crimson}}>Blocked · Contains allergen</div>
        </div>
        <div style={{fontFamily:'var(--font-serif)',fontWeight:600,fontSize:26,letterSpacing:'-0.01em',color:c.ink900,lineHeight:'32px'}}>Soy sauce has soy.</div>
        <div style={{fontSize:14,color:c.ink700,marginTop:8,lineHeight:'20px'}}>You told me Amelia is allergic to soy. I won't suggest this — even as a swap for miso.</div>
      </div>

      <div style={{background:c.paper100,borderRadius:14,border:`1px solid ${c.ink100}`,padding:'12px 14px',display:'flex',gap:10,alignItems:'flex-start'}}>
        {SF.shield(c.sage,14)}
        <div style={{fontSize:13,color:c.ink700,lineHeight:'18px',flex:1}}>
          <b style={{color:c.ink900,fontWeight:600}}>Why this matters.</b> Stir will not override an allergy, ever — not for convenience, not via voice. <span style={{color:c.ink500}}>Review allergens in Settings · Household.</span>
        </div>
      </div>

      {/* Safe alternatives */}
      <div>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:'0.12em',textTransform:'uppercase',color:c.ink500,marginBottom:8}}>Safe alternatives</div>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          <button style={{textAlign:'left',border:`1.5px solid ${c.ember}`,background:c.emberTint,borderRadius:14,padding:'12px 14px',display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,cursor:'pointer'}}>
            <div>
              <div style={{fontSize:10,fontWeight:700,letterSpacing:'0.12em',textTransform:'uppercase',color:c.ember,marginBottom:2}}>Recommended</div>
              <div style={{fontSize:15,fontWeight:600,color:c.ink900}}>Coconut aminos</div>
              <div style={{fontSize:12,color:c.ink700,marginTop:2,display:'flex',alignItems:'center',gap:6}}>
                <span style={{width:6,height:6,borderRadius:999,background:c.sage}}/> Soy-free. Sweeter, less salty.
              </div>
            </div>
            {SF.chev(c.ember,16)}
          </button>
          <button style={{textAlign:'left',border:`1px solid ${c.ink100}`,background:c.paper100,borderRadius:14,padding:'12px 14px',display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,cursor:'pointer'}}>
            <div>
              <div style={{fontSize:15,fontWeight:600,color:c.ink900}}>Chickpea miso</div>
              <div style={{fontSize:12,color:c.ink700,marginTop:2,display:'flex',alignItems:'center',gap:6}}>
                <span style={{width:6,height:6,borderRadius:999,background:c.amber}}/> Check label for soy cross-contamination.
              </div>
            </div>
            {SF.chev(c.ink500,16)}
          </button>
        </div>
      </div>
    </div>

    <div style={{padding:'14px 18px 18px',borderTop:`1px solid ${c.ink100}`,display:'flex',gap:10}}>
      <button style={{flex:1,height:52,borderRadius:12,background:c.paper100,border:`1px solid ${c.ink100}`,fontSize:15,fontWeight:600,color:c.ink700}}>Edit allergies</button>
      <button style={{flex:2,height:52,borderRadius:12,border:0,background:c.ember,color:'#fff',fontSize:17,fontWeight:600}}>Use coconut aminos</button>
    </div>
  </div>);
}

function Page(){
  return(<div className="mock-page">
    <header className="mock-header">
      <h1 className="mock-title">08 · Substitution</h1>
      <p className="mock-sub">
        Substitution is a trust surface. Three screens: the entry sheet (invoked
        from any ingredient chip), the safe-swap result, and the
        allergen-blocked result. The blocked state is <em>non-negotiable</em> —
        Stir will never propose a swap that violates a household allergy, even
        if the user voice-commands it. Crimson, not amber: it's a hard stop.
      </p>
      <div className="mock-meta">
        <span>Catalog #24–#26</span>
        <span>iPhone 16 Pro · 390×844</span>
        <span>Tier: Free (sheet) · Premium adds voice hint</span>
        <span>Specs §10 — Substitutions & Allergens</span>
      </div>
    </header>
    <main className="mock-main">
      <section className="mock-section">
        <h2 className="mock-section-title">Substitution sheet (Premium voice hint)</h2>
